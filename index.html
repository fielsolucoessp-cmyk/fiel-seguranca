<style>

.auth-box .brand{color:var(--navy);font-size:22px}.auth-box .brand b{color:color-mix(in srgb,var(--or) 75%,#000)}

.radio input{display:none}.radio label.on{border-color:var(--or);background:color-mix(in srgb,var(--or) 10%,#fff);color:var(--navy)}
.lgpd{font-size:12px;color:var(--mut);background:#f7f9fc;border-radius:8px;padding:10px;margin:6px 0 12px;max-height:120px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px}.chk input{width:auto;margin-top:3px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:8px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;margin:14px 0 4px}.gbtn:hover{background:#f6f8fc}.gbtn svg{width:20px;height:20px;flex:none}
.ou{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:10px 0 12px}.ou:before,.ou:after{content:'';flex:1;border-top:1px solid var(--bd)}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}main{padding:12px}th,td{padding:8px 6px}}

<script>
/* ================= CONFIGURAÇÃO ================= */
const CONFIG = {
  SUPABASE_URL: 'https://qffqahrsmgqgxuzgrdsh.supabase.co',      // ex.: https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZnFhaHJzbWdxZ3h1emdyZHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODM5MTQsImV4cCI6MjEwNzc1OTkxNH0.VLJR5L7CHs5zVbNKkvkY7KEe5F-Vz_KQmoP3G2jAEI0',     // Project Settings > API > anon public
  ESCOLA: 'rondon',                                 // identificador da escola (tabela escolas.slug)
  GOOGLE_CLIENT_ID: '79884176867-ig5o7ukfqlogrikhp1bf3666tlh5gunv.apps.googleusercontent.com'  // público (login com Google)
};
const VERSAO = '1.26.1';

/* ================= UTILITÁRIOS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soDig = s => String(s || '').replace(/\D/g, '');
function hojeISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1, d+n)); }
function addMeses(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1+n, d)); }
function dias(iso){ if(!iso) return null; const [a,m,d] = iso.slice(0,10).split('-').map(Number); const t = new Date(a,m-1,d); const h = new Date(); h.setHours(0,0,0,0); return Math.round((t-h)/864e5); }
function fmt(iso){ if(!iso) return '—'; const s = String(iso); if(s.length > 10){ const d = new Date(s); return d.toLocaleDateString('pt-BR'); } const [a,m,d] = s.split('-'); return d+'/'+m+'/'+a; }
function fmtDoc(v){ const d = soDig(v); if(d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); if(d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); return v || '—'; }
function cpfValido(v){
  const c = soDig(v); if(c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for(let t = 9; t < 11; t++){ let s = 0; for(let i = 0; i < t; i++) s += Number(c[i]) * (t+1-i); if(((s*10) % 11) % 10 !== Number(c[t])) return false; }
  return true;
}
function cnpjValido(v){
  const c = soDig(v); if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s = 0, p = n - 7; for(let i = 0; i < n; i++){ s += Number(c[i]) * p--; if(p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === Number(c[12]) && calc(13) === Number(c[13]);
}
function toast(msg, tipo){ const d = document.createElement('div'); if(tipo) d.className = tipo; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), tipo === 'erro' ? 6000 : 3500); }
function traduzErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  const mapa = [
    ['Invalid login credentials','E-mail ou senha incorretos.'],
    ['Email not confirmed','Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).'],
    ['User already registered','Este e-mail já está cadastrado.'],
    ['Password should be at least','A senha precisa ter pelo menos 8 caracteres.'],
    ['row-level security','Você não tem permissão para esta ação.'],
    ['For security purposes','Aguarde alguns segundos e tente de novo.'],
    ['Failed to fetch','Sem conexão com o servidor. Verifique sua internet.'],
    ['Payload too large','Arquivo muito grande (máximo 10 MB).'],
    ['mime type','Tipo de arquivo não aceito. Envie foto (JPG/PNG) ou PDF.']
  ];
  for(const [k, v] of mapa) if(m.includes(k)) return v;
  return m;
}
/* ---------- registro de erros (vai para o painel FIEL) ---------- */
const _errosVistos = new Set(); let _errosN = 0;
function registrarErro(msg, pilha){
  try {
    msg = String(msg || 'erro').slice(0, 500); const k = msg + '|' + (S.view || '');
    if(_errosVistos.has(k) || _errosN >= 20 || !sb) return; _errosVistos.add(k); _errosN++;
    sb.from('erros_cliente').insert({ escola_id: S.perfil ? S.perfil.escola_id : (S.escola ? S.escola.id : null), versao: VERSAO, tela: String(S.view || 'inicio').slice(0, 60), mensagem: msg, pilha: pilha ? String(pilha).slice(0, 2000) : null, navegador: navigator.userAgent.slice(0, 250) }).then(() => {}, () => {});
  } catch(_){}
}
window.addEventListener('error', e => registrarErro(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; if(r._mostrado) return; registrarErro(r.message || String(r), r.stack); });
async function q(promise){ const { data, error } = await promise; if(error){ toast(traduzErro(error), 'erro'); try { error._mostrado = true; } catch(_){} throw error; } return data; }
async function buscarTodos(montar){ let out = [], i = 0; for(;;){ const d = await q(montar().range(i, i+999)); out = out.concat(d); if(d.length < 1000) break; i += 1000; } return out; }

/* ================= ESTADO ================= */
const SLUG = new URLSearchParams(location.search).get('escola') || CONFIG.ESCOLA;
let sb = null;
const S = { sessao:null, perfil:null, escola:null, cursos:[], empresas:{}, minhaPessoa:null, view:'', param:null, hist:[], msgs:{}, recovery:false, pessoa:null, busca:'' };
const staff = () => !!S.perfil && ['staff','admin'].includes(S.perfil.tipo);
const linkPortal = () => location.origin + location.pathname + (SLUG !== CONFIG.ESCOLA ? '?escola=' + encodeURIComponent(SLUG) : '');

const SOL = { rascunho:['Rascunho',''], enviada:['Aguardando análise','warn'], pendente:['Pendência — corrigir','bad'], aprovada:['Aceita','ok'], matriculada:['Matriculado','nv'], concluida:['Concluída','ok'], reprovado:['Reprovado','bad'], recusada:['Recusada','bad'], cancelada:['Cancelada',''] };
const DOCST = { falta:['Não enviado',''], enviado:['Em análise','warn'], aprovado:['Aprovado','ok'], recusado:['Recusado','bad'], vencido:['Vencido','bad'] };
const bdg = (par) => '<span class="bdg '+par[1]+'">'+esc(par[0])+'</span>';
function bdgValidade(iso){ const d = dias(iso); if(d === null) return '<span class="bdg">—</span>'; if(d < 0) return '<span class="bdg bad">Vencido em '+fmt(iso)+'</span>'; if(d <= 30) return '<span class="bdg bad">Vence em '+d+' dia(s)</span>'; if(d <= 90) return '<span class="bdg warn">Vence em '+fmt(iso)+'</span>'; return '<span class="bdg ok">Válido até '+fmt(iso)+'</span>'; }
const parseDocs = c => (c && c.docs_exigidos || []).map(t => ({ nome: t.replace(/^\?/, '').trim(), opcional: t.startsWith('?') }));
const curso = id => S.cursos.find(c => c.id === id) || {};
function todosTiposDoc(){ const set = new Set(); S.cursos.forEach(c => parseDocs(c).forEach(d => set.add(d.nome))); set.add('Certificado de curso anterior'); set.add('Outro documento'); return [...set]; }

/* ================= MODAL ================= */
function abrirModal(titulo, corpo, botoes){
  $('#modal').innerHTML = '<div class="mbox"><h3>'+esc(titulo)+'</h3>'+corpo+'<div class="mact">'+(botoes || '')+'<button class="btn sec" onclick="fecharModal()">Fechar</button></div></div>';
  $('#modal').classList.add('on');
}
function fecharModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
function travar(btn, txt){ if(!btn) return () => {}; const o = btn.textContent; btn.disabled = true; btn.textContent = txt || 'Aguarde...'; return () => { btn.disabled = false; btn.textContent = o; }; }

/* ================= MARCA E APLICATIVO ================= */
function corValida(c){ return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : null; }
function aplicarMarca(){
  const e = S.escola || {}, r = document.documentElement.style;
  const p = corValida(e.cor_primaria), d = corValida(e.cor_destaque);
  if(p){ r.setProperty('--navy', p); r.setProperty('--navy2', misturar(p, '#ffffff', .14)); } else { r.removeProperty('--navy'); r.removeProperty('--navy2'); }
  if(d) r.setProperty('--or', d); else r.removeProperty('--or');
  if(d && (() => { const [R, G, B] = [1, 3, 5].map(i => parseInt(d.slice(i, i + 2), 16) / 255); return .299 * R + .587 * G + .114 * B > .6; })()) r.setProperty('--or-tx', '#151515'); else r.removeProperty('--or-tx');
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = p || '#14213d';
  if(nomeExib()) document.title = nomeExib();
}
function misturar(a, b, t){ const h = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16)); const A = h(a), B = h(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const nomeExib = () => S.escola ? (S.escola.nome_curto || S.escola.nome || '') : '';
const brandHtml = () => { const n = nomeExib().trim(); if(!n) return '<div class="brand">Portal <b>da Escola</b></div>'; const i = n.indexOf(' '); return '<div class="brand">'+(i > 0 ? esc(n.slice(0, i))+' <b>'+esc(n.slice(i + 1))+'</b>' : '<b>'+esc(n)+'</b>')+'</div>'; };
const rodapeFiel = '<p class="rodape">FIEL Soluções em Segurança Privada</p>';
const logoHtml = () => S.escola && S.escola.logo_url ? '<img class="logo" src="'+esc(S.escola.logo_url)+'" alt="'+esc(S.escola.nome)+'">' : '';
let _instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _instalar = e; document.querySelectorAll('#btnInstalar').forEach(b => b.style.display = 'inline-block'); });
async function instalarApp(){ if(!_instalar) return toast('Use o menu do navegador e escolha "Adicionar à tela inicial".'); _instalar.prompt(); await _instalar.userChoice; _instalar = null; document.querySelectorAll('#btnInstalar').forEach(b => b.style.display = 'none'); }

async function iniciar(){
  if(!window.supabase || CONFIG.SUPABASE_URL.startsWith('COLE')){
    $('#app').innerHTML = '<div class="auth"><div class="auth-box"><div class="brand">FIEL <b style="color:var(--or)">Segurança Privada</b></div><p>Sistema ainda não configurado.</p><p class="muted small">Preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do arquivo index.html.</p></div></div>';
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data: escola } = await sb.from('escolas').select('*').eq('slug', SLUG).maybeSingle();
  S.escola = escola;
  aplicarMarca();
  sb.auth.onAuthStateChange((ev, sessao) => {
    if(ev === 'PASSWORD_RECOVERY'){ S.recovery = true; telaAuth('nova'); return; }
    if(ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED'){ S.sessao = sessao; return; }
    setTimeout(() => entrar(sessao), 0);
  });
}

async function entrar(sessao){
  if(S.recovery) return telaAuth('nova');
  if(!sessao){ S.sessao = null; S.perfil = null; return telaAuth('entrar'); }
  if(S.perfil && S.sessao && S.sessao.user.id === sessao.user.id){ S.sessao = sessao; return; }
  S.sessao = sessao;
  try {
    const perfil = await q(sb.from('perfis').select('*').eq('id', sessao.user.id).maybeSingle());
    if(!perfil){ $('#app').innerHTML = '<div class="auth"><div class="auth-box"><p>Seu cadastro não foi encontrado. Fale com a escola.</p><button class="btn" onclick="sair()">Sair</button></div></div>'; return; }
    S.perfil = perfil;
    if(!perfil.consentimento_em && ['aluno','empresa'].includes(perfil.tipo) && ((sessao.user.app_metadata || {}).providers || [(sessao.user.app_metadata || {}).provider]).includes('google')) return telaCompletar();
    if(!S.escola || S.escola.id !== perfil.escola_id) S.escola = await q(sb.from('escolas').select('*').eq('id', perfil.escola_id).single());
    aplicarMarca();
    const rd = await sb.rpc('sou_dono'); S.dono = !rd.error && rd.data === true;
    if(S.escola && S.escola.ativa === false && !S.dono){ $('#app').innerHTML = '<div class="auth"><div class="auth-box">'+logoHtml()+brandHtml()+'<div class="aviso bad" style="margin-top:16px">O acesso ao portal de <b>'+esc(S.escola.nome)+'</b> está temporariamente suspenso. Fale diretamente com a escola.</div><button class="btn sec" onclick="sair()">Sair</button></div></div>'; return; }
    await carregarCursos();
    if(staff()) await carregarEmpresas();
    if(staff()) await carregarInstrutores();
    if(perfil.tipo === 'aluno'){ const p = await q(sb.from('pessoas').select('id').eq('usuario_id', perfil.id).limit(1)); S.minhaPessoa = p[0] ? p[0].id : null; }
    S.hist = [];
    if(staff()){ const m1 = MODULOS.find(([k]) => podeModulo(k)); go(m1 ? m1[0] : 'semacesso', null, false); }
    else if(perfil.tipo === 'empresa') go('einicio', null, false);
    else if(perfil.tipo === 'instrutor') go('aulas', null, false);
    else go('inicio', null, false);
  } catch(e){ console.error(e); }
}
async function carregarCursos(){ S.cursos = await q(sb.from('cursos').select('*').eq('escola_id', S.perfil.escola_id).order('sigla')); }
async function carregarInstrutores(){ S.instrutores = await q(sb.from('perfis').select('id,nome,email').eq('tipo','instrutor').eq('escola_id', S.perfil.escola_id).order('nome')); }
const nomeInstrutor = id => { const i = (S.instrutores || []).find(x => x.id === id); return i ? (i.nome || i.email) : ''; };
async function carregarEmpresas(){ const l = await q(sb.from('perfis').select('id,nome,cpf_cnpj,telefone,email').eq('tipo','empresa').eq('escola_id', S.perfil.escola_id).order('nome')); S.empresas = {}; l.forEach(e => S.empresas[e.id] = e); }
async function sair(){ await sb.auth.signOut(); S.perfil = null; S.sessao = null; telaAuth('entrar'); }

// Botão oficial do Google (a tela do Google mostra o endereço do portal, não o do Supabase).
// No app instalado na tela inicial e se o Google não carregar, fica o botão antigo (redirecionamento).
let _gis = null;
function carregarGis(){
  if(!_gis) _gis = new Promise((ok, erro) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = () => { _gis = null; erro(); }; document.head.appendChild(s); });
  return _gis;
}
async function montarGoogle(aba){
  if(!CONFIG.GOOGLE_CLIENT_ID || window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  try { await carregarGis(); } catch(e){ return; }
  const box = $('#gisBox'), fb = $('#gFallback');
  if(!box || !fb || !(window.google && google.accounts && google.accounts.id)) return;
  if(!window.crypto || !crypto.subtle) return;
  const bruto = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
  const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(bruto))), b => b.toString(16).padStart(2, '0')).join('');
  S.gNonce = bruto;
  google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, nonce: hash, context: aba === 'cadastro' ? 'signup' : 'signin', itp_support: true, callback: r => entrarComToken(r.credential) });
  box.style.cssText = 'display:flex;justify-content:center;margin:14px 0 4px;min-height:44px';
  google.accounts.id.renderButton(box, { type: 'standard', theme: 'outline', size: 'large', shape: 'rectangular', text: aba === 'cadastro' ? 'signup_with' : 'signin_with', logo_alignment: 'center', locale: 'pt-BR', width: Math.max(200, Math.min(400, box.offsetWidth || 340)) });
  fb.style.display = 'none';
}
async function entrarComToken(token){

}

async function salvarCompletar(btn){

async function fazerLogin(btn){
  let email = $('#aEmail').value.trim(); const senha = $('#aSenha').value;
  if(!email || !senha) return toast('Informe e-mail (ou CPF/CNPJ) e senha.', 'erro');
  const solta = travar(btn, 'Entrando...');
  if(!email.includes('@')){
    const doc = soDig(email);
    if(doc.length !== 11 && doc.length !== 14){ solta(); return toast('Informe um e-mail ou um CPF/CNPJ válido.', 'erro'); }
    const r = await sb.rpc('email_para_login', { doc, senha });
    if(r.error || !r.data){ solta(); return toast('CPF/CNPJ ou senha incorretos.', 'erro'); }
    email = r.data;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  solta();
  if(error) toast(traduzErro(error), 'erro');
}
async function fazerCadastro(btn){
  const t = S.tipoCad, nome = $('#cNome').value.trim(), doc = soDig($('#cDoc').value), tel = $('#cTel').value.trim();
  const email = $('#cEmail').value.trim(), s1 = $('#cSenha').value, s2 = $('#cSenha2').value;
  if(nome.length < 3) return toast('Informe o nome.', 'erro');
  if(t === 'aluno' && !cpfValido(doc)) return toast('CPF inválido.', 'erro');
  if(t === 'empresa' && !cnpjValido(doc)) return toast('CNPJ inválido.', 'erro');
  if(soDig(tel).length < 10) return toast('Informe o telefone com DDD.', 'erro');
  if(!/^\S+@\S+\.\S+$/.test(email)) return toast('E-mail inválido.', 'erro');
  if(s1.length < 8) return toast('A senha precisa ter pelo menos 8 caracteres.', 'erro');
  if(s1 !== s2) return toast('As senhas não conferem.', 'erro');
  if(!$('#cLgpd').checked) return toast('É preciso concordar com o tratamento dos dados.', 'erro');
  const solta = travar(btn, 'Criando conta...');
  const { data, error } = await sb.auth.signUp({ email, password: s1, options: { emailRedirectTo: linkPortal(), data: { nome, tipo: t, cpf_cnpj: doc, telefone: tel, escola: SLUG, consentimento: true } } });
  solta();
  if(error) return toast(traduzErro(error), 'erro');
  if(data.user && data.user.identities && data.user.identities.length === 0) return toast('Este e-mail já está cadastrado. Use "Esqueci minha senha".', 'erro');
  if(!data.session){
    $('.auth-box').innerHTML = brandHtml()+'<div class="aviso ok" style="margin-top:16px">Conta criada! Enviamos um link de confirmação para <b>'+esc(email)+'</b>. Abra o e-mail (veja também o spam) e clique no link para ativar sua conta.</div><button class="btn sec" onclick="telaAuth(\'entrar\')">Ir para o login</button>';
  }
}
async function pedirNovaSenha(btn){
  const email = $('#rEmail').value.trim(); if(!email) return toast('Informe o e-mail.', 'erro');
  const solta = travar(btn);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: linkPortal() });

async function salvarNovaSenha(btn){
  const s1 = $('#nSenha').value, s2 = $('#nSenha2').value;
  if(s1.length < 8) return toast('A senha precisa ter pelo menos 8 caracteres.', 'erro');

const MODULOS = [['painel','Painel'],['analise','Análise'],['turmas','Turmas'],['aulas','Aulas'],['pessoas','Pessoas'],['empresas','Empresas'],['vencimentos','Vencimentos'],['cursos','Cursos'],['certificados','Certificados'],['financeiro','Financeiro'],['orcamentos','Orçamentos'],['escola','Escola']];

const podeModulo = k => !S.perfil || S.perfil.tipo !== 'staff' || S.dono || !Array.isArray(S.perfil.modulos) || S.perfil.modulos.includes(k);
function menu(){

async function prepararArquivo(file){
  if(file.type === 'application/pdf'){ if(file.size > 10*1024*1024) throw new Error('PDF maior que 10 MB.'); return { blob: file, ext: 'pdf', tipo: 'application/pdf' }; }
  if(!file.type.startsWith('image/')) throw new Error('Envie uma foto (JPG/PNG) ou um PDF.');
  const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('Não foi possível ler a imagem. Tente JPG ou PDF.')); i.src = URL.createObjectURL(file); });
  const max = 1800, f = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
  return { blob, ext: 'jpg', tipo: 'image/jpeg', w: c.width, h: c.height };
}
/* PDF A4 com uma foto por página, centralizada — formato aceito pelo GESP */
function pdfDeJpegs(fotos){

  obj(2, () => add('<< /Type /Pages /Kids [' + kids + '] /Count ' + N + ' >>'));

    const pg = 3 + i*3, im = pg + 1, ct = pg + 2;
    const deitado = w > h, pw = deitado ? 841.89 : 595.28, ph = deitado ? 595.28 : 841.89, m = 20;
    const k = Math.min((pw - 2*m) / w, (ph - 2*m) / h), dw = +(w*k).toFixed(2), dh = +(h*k).toFixed(2), x = +((pw - dw) / 2).toFixed(2), y = +((ph - dh) / 2).toFixed(2);
    const cont = 'q ' + dw + ' 0 0 ' + dh + ' ' + x + ' ' + y + ' cm /Im0 Do Q';
    obj(pg, () => add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>'));
    obj(im, () => { add('<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n'); add(jpg); add('\nendstream'); });
    obj(ct, () => add('<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream'));

  let tab = 'xref\n0 ' + total + '\n0000000000 65535 f \n';

  add(tab + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

/* PDF de um documento: usa o já gerado, o próprio arquivo (se for PDF) ou gera agora a partir da foto */
async function pdfDoDocumento(d){
  const baixar = async path => { const { data, error } = await sb.storage.from('documentos').download(path); if(error) throw error; return data; };
  const ajustes = Array.isArray(d.ajustes) ? d.ajustes : [];
  if(d.pdf_path && !ajustes.some(Boolean)) return baixar(d.pdf_path);
  if(/\.pdf$/i.test(d.arquivo_path)) return baixar(d.arquivo_path);
  const fotos = [], paths = d.paginas && d.paginas.length ? d.paginas : [d.arquivo_path];
  for(let i = 0; i < paths.length; i++){
    const foto = await baixar(paths[i]), aj = ajustes[i];
    const img = await abrirImagem(foto);
    if(!aj && /jpe?g/i.test(foto.type || 'image/jpeg') && /\.jpe?g$/i.test(paths[i])){
      // sem ajuste: usa a foto original como está, sem recomprimir
      fotos.push({ jpg: new Uint8Array(await foto.arrayBuffer()), w: img.naturalWidth, h: img.naturalHeight });
      continue;
    }

    const cv = aplicarAjuste(img, aj || { r: 0, x: 0, y: 0, w: 1, h: 1 });

function girarImagem(img, r){

function aplicarAjuste(img, aj){
  const src = girarImagem(img, aj.r || 0), sx = Math.round(aj.x * src.width), sy = Math.round(aj.y * src.height);

/* ZIP simples (sem compressão) — junta vários PDFs num arquivo só */
const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const ch = new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,hora,2],[14,dia,2],[16,crc,4],[20,dados.length,4],[24,dados.length,4],[28,nome.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([p, v, n]) => n === 4 ? ch.setUint32(p, v, true) : ch.setUint16(p, v, true));

const edPonto = ev => { const r = $('#edCv').getBoundingClientRect(), cv = $('#edCv'); return { x: Math.max(0, Math.min(cv.width, (ev.clientX - r.left) * cv.width / r.width)), y: Math.max(0, Math.min(cv.height, (ev.clientY - r.top) * cv.height / r.height)) }; };
function edInicio(ev){
  const e = S.ed, p = edPonto(ev), s = e.sel; ev.target.setPointerCapture(ev.pointerId);

async function edSalvar(btn, desfazer){

function blocoAndamento(s){

  if(prox.length) h += '<div class="small" style="margin-top:8px"><b>Próximas aulas:</b> '+prox.map(x => fmt(x.data)+(x.inicio ? ' '+x.inicio.slice(0, 5) : '')+(x.disciplina ? ' — '+esc(x.disciplina) : '')).join(' · ')+'</div>';
  if(aulas.length) h += '<details style="margin-top:8px"><summary class="small" style="cursor:pointer">Ver cronograma completo ('+aulas.length+' aulas)</summary><div class="tw"><table><tr><th>Data</th><th>Horário</th><th>Disciplina</th><th>Instrutor</th><th>Situação</th></tr>'+aulas.map(x =>
      '<tr><td>'+fmt(x.data)+'</td><td>'+(x.inicio ? x.inicio.slice(0, 5) + (x.fim ? '–' + x.fim.slice(0, 5) : '') : '—')+'</td><td>'+esc(x.disciplina || '—')+'</td><td class="small">'+esc(x.instrutor || '—')+'</td><td>'+(x.feita ? (x.presente === false ? '<span class="bdg bad">Falta</span>' : x.presente ? '<span class="bdg ok">Presente</span>' : '<span class="bdg ok">Dada</span>') : x.data < hoje ? '<span class="bdg">Aguardando registro</span>' : '<span class="bdg">Programada</span>')+'</td></tr>').join('')+'</table></div></details>';

  h += '<div class="secao mc" id="ePre">Em pré-matrícula ('+pre.length+')</div><div class="card">'+tab(pre, 'Detalhe')+'</div>';

async function importar(btn, empresaId){
  const linhas = $('#imTxt').value.split('\n').map(l => l.trim()).filter(Boolean);
  const ok = [], erros = [];
  linhas.forEach((l, i) => {
    const c = l.split(/[;\t]/).map(x => x.trim());
    const cpf = soDig(c[1]);
    if(!c[0] || c[0].length < 3) erros.push('Linha '+(i+1)+': nome vazio');
    else if(!cpfValido(cpf)) erros.push('Linha '+(i+1)+' ('+c[0]+'): CPF inválido');
    else ok.push({ escola_id: S.perfil.escola_id, empresa_id: empresaId && empresaId !== 'null' ? empresaId : null, nome: c[0], cpf, telefone: c[2] || null, email: c[3] || null });
  });
  if(!ok.length) return toast(erros[0] || 'Nada para importar.', 'erro');
  const solta = travar(btn, 'Importando...');
  try {
    await q(sb.from('pessoas').insert(ok));
    fecharModal(); toast(ok.length+' cadastrado(s).'+(erros.length ? ' '+erros.length+' linha(s) ignorada(s).' : ''));
    if(erros.length) abrirModal('Linhas não importadas', '<ul>'+erros.map(e => '<li>'+esc(e)+'</li>').join('')+'</ul>', '');
    recarregar();
  } finally { solta(); }
}

async function vVencimentos(){
  const hoje = hojeISO();
  const linhas = await buscarTodos(() => sb.from('v_validades').select('*').lte('vence_em', addDias(hoje, 120)).gte('vence_em', addDias(hoje, -365)).order('vence_em'));
  let ultimos = {};
  if(staff() && linhas.length){
    const ids = [...new Set(linhas.map(l => l.pessoa_id))];
    for(let i = 0; i < ids.length; i += 150){
      const av = await q(sb.from('avisos').select('pessoa_id,enviado_em,canal').in('pessoa_id', ids.slice(i, i+150)).order('enviado_em', { ascending: false }));
      av.forEach(a => { if(!ultimos[a.pessoa_id]) ultimos[a.pessoa_id] = a; });
    }
  }
  const grupos = [['Vencidos (último ano)', l => dias(l.vence_em) < 0], ['Vencem em até 30 dias', l => dias(l.vence_em) >= 0 && dias(l.vence_em) <= 30], ['Vencem de 31 a 120 dias', l => dias(l.vence_em) > 30]];
  let h = '<h2>Vencimentos de cursos</h2>';
  if(!linhas.length) return h + '<div class="card"><p class="muted">Nenhum curso vencido ou vencendo nos próximos 120 dias.</p><p class="small muted">A validade é calculada a partir dos cursos concluídos registrados em cada cadastro.</p></div>';
  grupos.forEach(([titulo, filtro]) => {

async function salvarForn(id, btn){

function graficoFin(meses){
  const estreito = window.innerWidth < 600, W = estreito ? 360 : 900, H = estreito ? 220 : 250, mL = estreito ? 44 : 60, mR = 8, mT = 16, mB = 26, n = meses.length;
  const curto = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : Math.round(v).toLocaleString('pt-BR');
  const max = topoBom(Math.max(1, ...meses.flatMap(m => [m.e, m.s]))), Y = v => H - mB - (H - mB - mT) * v / max;
  const passo = (W - mL - mR) / n, larg = Math.min(34, (passo - 14) / 2);
  const barra = (x, v, cor, tt) => { if(!(v > 0)) return ''; const y = Y(v), h = H - mB - y, r = Math.min(4, h); return '<path'+dica(tt)+' fill="'+cor+'" d="M'+x+','+(H - mB)+' V'+(y + r)+' Q'+x+','+y+' '+(x + r)+','+y+' H'+(x + larg - r)+' Q'+(x + larg)+','+y+' '+(x + larg)+','+(y + r)+' V'+(H - mB)+' Z"/>'; };
  let g = '';
  [0, max / 2, max].forEach(t => { g += '<line x1="'+mL+'" x2="'+(W - mR)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="'+(t ? '#eef1f6' : '#dfe3ec')+'"/><text x="'+(mL - 6)+'" y="'+(Y(t) + 4)+'" text-anchor="end">'+(t ? 'R$ ' + curto(t) : '0')+'</text>'; });
  meses.forEach((m, i) => {
    const x0 = mL + i * passo + (passo - 2 * larg - 2) / 2, tt = '<b>'+rotMes(m.mes)+'</b><br>Entradas: <b>'+brl(m.e)+'</b><br>Saídas: <b>'+brl(m.s)+'</b><br>Saldo: <b>'+brl(m.e - m.s)+'</b>';
    g += barra(x0, m.e, '#1baf7a', tt) + barra(x0 + larg + 2, m.s, '#eb6834', tt);
    if(!estreito || n <= 6 || i % 2 === 0) g += '<text x="'+(mL + i * passo + passo / 2)+'" y="'+(H - 8)+'" text-anchor="middle">'+rotMes(m.mes, true)+'</text>';
  });
  const tot = k => meses.reduce((a, m) => a + m[k], 0);
  return '<div class="leg"><span><i style="background:#1baf7a"></i>Entradas <b style="color:var(--tx)">'+brl(tot('e'))+'</b></span><span><i style="background:#eb6834"></i>Saídas <b style="color:var(--tx)">'+brl(tot('s'))+'</b></span><span>Saldo <b style="color:var(--tx)">'+brl(tot('e') - tot('s'))+'</b></span></div>'+
    '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Entradas e saídas por mês">'+g+'</svg>'+

async function salvarLanc(tipo, id, btn){
  const desc = $('#lcDesc').value.trim(), valor = lerValor($('#lcValor').value), venc = $('#lcVenc').value, cat = $('#lcCat').value;
  if(!desc) return toast('Informe a descrição.', 'erro');
  if(!cat || cat === 'nova') return toast('Escolha a categoria.', 'erro');
  if(!(valor > 0)) return toast('Informe um valor maior que zero.', 'erro');
  if(!venc) return toast('Informe o vencimento.', 'erro');
  const nomeP = $('#lcPessoa') ? $('#lcPessoa').value.trim() : '', cli = nomeP ? opcoesCliente().find(o => o.v === nomeP) || opcoesCliente().find(o => o.nome === nomeP) : null;
  if(nomeP && !cli) return toast('Cliente não encontrado. Escolha um aluno ou uma empresa da lista, ou deixe em branco.', 'erro');
  const curso = cat.startsWith('curso:') ? S.cursos.find(c => c.id === cat.slice(6)) : null;
  const pagoOk = $('#lcPago').checked, base = { escola_id: S.perfil.escola_id, tipo, descricao: desc, categoria: curso ? nomeCurso(curso) : cat.slice(4), curso_id: curso ? curso.id : null, conta_id: $('#lcConta').value || null,
    pessoa_id: cli && cli.tipo === 'aluno' ? cli.id : null, empresa_id: cli && cli.tipo === 'empresa' ? cli.id : null, fornecedor_id: $('#lcForn') && $('#lcForn').value && $('#lcForn').value !== 'novo' ? $('#lcForn').value : null, obs: $('#lcObs').value.trim() || null };
  const pg = pagoOk ? { pago_em: $('#lcPgData').value || hojeISO(), forma: $('#lcForma').value } : { pago_em: null, forma: null };
  const solta = travar(btn);
  try {
    if(id){ await q(sb.from('lancamentos').update({ ...base, valor, vencimento: venc, ...pg }).eq('id', id)); }
    else {
      const rep = $('#lcRep').value, n = rep ? Math.min(60, Math.max(2, parseInt($('#lcVezes').value) || 2)) : 1;
      const grupo = n > 1 ? crypto.randomUUID() : null, linhas = [];
      const vParc = rep === 'parcelar' ? Math.floor(valor * 100 / n) / 100 : valor, resto = rep === 'parcelar' ? Math.round((valor - vParc * n) * 100) / 100 : 0;
      for(let i = 0; i < n; i++) linhas.push({ ...base, valor: Math.round((vParc + (i === 0 ? resto : 0)) * 100) / 100, vencimento: addMesFixo(venc, i), grupo, parcela: n > 1 ? (i + 1) + '/' + n : null, ...(i === 0 ? pg : { pago_em: null, forma: null }) });
      await q(sb.from('lancamentos').insert(linhas));
    }
    fecharModal(); toast(id ? 'Lançamento atualizado.' : 'Lançamento salvo.');
    if(S.view === 'financeiro') recarregar();
  } finally { solta(); }
}

let _jspdf = null;
function carregarJsPdf(){
  if(!_jspdf) _jspdf = (async () => {
    const add = src => new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet.')); document.head.appendChild(s); });
    await add('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    await add('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
    return window.jspdf.jsPDF;
  })().catch(e => { _jspdf = null; throw e; });

async function emitirCert(ids, btn){

    }
    for(const id of velhos){ const c = S.certEmit[id]; await sb.from('certificados').update({ emissoes: (c.emissoes || 1) + 1, ultima_emissao: new Date().toISOString() }).eq('id', c.id); }

    });

async function enviarLogo(inp){
  const f = inp.files && inp.files[0]; inp.value = ''; if(!f) return;
  if(f.size > 1048576) return toast('O logo precisa ter até 1 MB.', 'erro');
  const ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z]/g, '') || 'png';
  const path = S.escola.id + '/logo-' + Date.now() + '.' + ext;
  await q(sb.storage.from('logos').upload(path, f, { contentType: f.type, upsert: false }));
  const url = sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
  const antigo = S.escola.logo_url;
  S.escola = await q(sb.from('escolas').update({ logo_url: url }).eq('id', S.escola.id).select().single());
  apagarLogoAntigo(antigo);
  toast('Logo atualizado.'); $('#app').innerHTML = ''; go('escola', null, false);
}
function apagarLogoAntigo(url){ const m = url && url.split('/object/public/logos/')[1]; if(m) sb.storage.from('logos').remove([decodeURIComponent(m)]); }
async function removerLogo(btn){
  if(!confirm('Remover o logo da escola?')) return;
  const solta = travar(btn); const antigo = S.escola.logo_url;
  try { S.escola = await q(sb.from('escolas').update({ logo_url: null }).eq('id', S.escola.id).select().single()); apagarLogoAntigo(antigo); toast('Logo removido.'); $('#app').innerHTML = ''; go('escola', null, false); } finally { solta(); }
}
async function salvarCores(btn, padrao){
  const dados = padrao ? { cor_primaria: null, cor_destaque: null } : { cor_primaria: $('#esCor1').value, cor_destaque: $('#esCor2').value };
  const solta = travar(btn);
  try { S.escola = await q(sb.from('escolas').update(dados).eq('id', S.escola.id).select().single()); aplicarMarca(); toast('Cores aplicadas.'); go('escola', null, false); } finally { solta(); }
}
async function salvarRetencao(btn){
  const n = Number($('#esRet').value); if(!(n >= 12 && n <= 240)) return toast('Informe entre 12 e 240 meses.', 'erro');
  const solta = travar(btn);
  try { S.escola = await q(sb.from('escolas').update({ retencao_meses: n }).eq('id', S.escola.id).select().single()); toast('Prazo salvo.'); } finally { solta(); }
}
async function baixarBackup(btn, escolaId, slug){
  const solta = travar(btn, 'Gerando...');
  try { const d = await q(sb.rpc('backup_escola', escolaId ? { p_escola: escolaId } : {})); baixarArquivo('backup-' + (slug || S.escola.slug) + '-' + hojeISO() + '.json', JSON.stringify(d, null, 2), 'application/json'); toast('Backup baixado. Guarde em local seguro.'); } finally { solta(); }

async function verLimpeza(btn){
  const solta = travar(btn);
  let l; try { l = await q(sb.rpc('candidatos_limpeza')); } finally { solta(); }
  S.limpeza = l;
  const pessoas = [...new Set(l.map(x => x.pessoa))];
  abrirModal('Documentos para descarte (LGPD)', l.length ?
    '<p class="small">'+l.length+' documento(s) de '+pessoas.length+' cadastro(s) sem atividade há mais de '+esc(S.escola.retencao_meses || 60)+' meses. O cadastro, o histórico e os certificados continuam; só os arquivos são apagados.</p><div class="tw" style="max-height:300px;overflow:auto"><table><tr><th>Pessoa</th><th>Documento</th><th>Última atividade</th></tr>'+l.map(x => '<tr><td>'+esc(x.pessoa)+'</td><td>'+esc(x.tipo)+'</td><td>'+fmt(x.ultima_atividade)+'</td></tr>').join('')+'</table></div><p class="small muted">Recomendado: baixe o backup antes.</p>'
    : '<p>Nenhum documento passou do prazo de guarda.</p>',
    l.length ? '<button class="btn dg" onclick="executarLimpeza(this)">Apagar '+l.length+' arquivo(s)</button>' : '');
}
async function executarLimpeza(btn){
  const l = S.limpeza || []; if(!l.length) return;
  if(!confirm('Apagar definitivamente '+l.length+' arquivo(s)? Esta ação não pode ser desfeita.')) return;
  const solta = travar(btn, 'Apagando...');
  try {
    const paths = [...new Set(l.map(x => x.arquivo_path).concat(l.map(x => x.pdf_path), l.flatMap(x => x.paginas || [])).filter(Boolean))];
    for(let i = 0; i < paths.length; i += 100) await q(sb.storage.from('documentos').remove(paths.slice(i, i + 100)));
    const ids = l.map(x => x.id);
    for(let i = 0; i < ids.length; i += 100) await q(sb.from('documentos').delete().in('id', ids.slice(i, i + 100)));
    S.limpeza = []; fecharModal(); toast(l.length + ' arquivo(s) apagado(s).');
  } finally { solta(); }
}
async function baixarMeusDados(){
  const P = S.pessoa || {};
  const dados = { gerado_em: new Date().toISOString(), escola: S.escola ? S.escola.nome : '', conta: { nome: S.perfil.nome, email: S.perfil.email, cpf: S.perfil.cpf_cnpj, telefone: S.perfil.telefone },
    cadastro: P.p, documentos: (P.docs || []).map(d => ({ tipo: d.tipo, situacao: d.status, enviado_em: d.enviado_em, validade: d.validade, observacao: d.obs_escola })),
    pre_matriculas: (P.sols || []).map(s => ({ curso: s.cursos ? s.cursos.sigla + ' — ' + s.cursos.nome : '', situacao: s.status, criada_em: s.criado_em, turma: s.turmas ? s.turmas.codigo : null, retorno_escola: s.obs_escola })),
    cursos_concluidos: (P.certs || []).map(c => ({ curso: c.cursos ? c.cursos.sigla + ' — ' + c.cursos.nome : '', conclusao: c.data_conclusao, origem: c.origem })) };
  baixarArquivo('meus-dados-' + hojeISO() + '.json', JSON.stringify(dados, null, 2), 'application/json');
  toast('Arquivo baixado. Os documentos enviados podem ser abertos aqui no portal.');
}

    '<label class="f"><span>Identificador no link</span><input id="neSlug" oninput="this.dataset.mexeu=1" placeholder="ex.: alfa"></label>'+

async function donoMudarFuncao(id, sel){
  const a = S.acessos[id], tipo = sel.value;
  const txt = { admin: 'Tornar ADMINISTRADOR da escola', staff: 'Tornar COLABORADOR (depois escolha os módulos)', instrutor: 'Tornar INSTRUTOR (só aulas)', aluno: 'REMOVER o acesso desta pessoa ao painel da escola' }[tipo];
  if(!confirm(txt + ': ' + (a.nome || a.email) + '?')){ sel.value = a.tipo; return; }
  try { await q(sb.rpc('dono_definir_acesso', { p_perfil: id, p_tipo: tipo, p_modulos: tipo === 'staff' ? a.modulos : null })); toast('Acesso atualizado. A pessoa precisa sair e entrar de novo.'); recarregar(); }
  catch(e){ sel.value = a.tipo; }

/* ---------- cronograma de aulas e chamada ---------- */
function cardCronograma(t, mats, aulas, discs, fechada){
  const hProg = {}, hDada = {};
  aulas.forEach(a => { const k = a.disciplina_id || '-'; hProg[k] = (hProg[k] || 0) + Number(a.horas || 0); if(a.chamada_feita) hDada[k] = (hDada[k] || 0) + Number(a.horas_dadas ?? a.horas ?? 0); });
  const totProg = aulas.reduce((s, a) => s + Number(a.horas || 0), 0), totCarga = discs.reduce((s, d) => s + Number(d.carga_horas || 0), 0), feitas = aulas.filter(a => a.chamada_feita).length;
  let h = '<div class="card"><div class="bar"><h3 style="margin:0">Cronograma de aulas ('+aulas.length+')</h3><span class="sp"></span>'+
    (aulas.length ? '<button class="btn sec sm" onclick="imprimirCronograma()">Imprimir cronograma</button>' : '')+
    (fechada ? '' : (feitas ? '<button class="btn nv sm" onclick="aplicarFrequencia(\''+t.id+'\',this)">Calcular frequência pela chamada</button>' : '')+'<button class="btn sm" onclick="modalAula(\'\')">+ Aula</button>')+'</div>';
  if(discs.length) h += '<div class="tw"><table><tr><th>Disciplina</th><th>Instrutor</th><th>Carga</th><th>Programado</th><th>Ministrado</th><th>Situação</th></tr>'+discs.map(d => {
      const pr = hProg[d.id] || 0, dd = hDada[d.id] || 0, falta = Number(d.carga_horas) - pr, pc = Number(d.carga_horas) ? Math.min(100, Math.round(dd * 100 / Number(d.carga_horas))) : 0;
      return '<tr><td>'+esc(d.nome)+'</td><td class="small">'+esc(nomeInstrutor(d.instrutor_id) || '—')+'</td><td>'+Number(d.carga_horas)+' h</td><td>'+pr+' h '+(falta > 0 ? '<span class="bdg warn">faltam '+falta+' h</span>' : '')+'</td><td style="min-width:110px">'+dd+' h<div class="prog"><i style="width:'+pc+'%"></i></div></td>'+
        '<td>'+(d._concluida ? '<span class="bdg ok">Concluída</span>'+(fechada ? '' : ' <a href="#" class="small" onclick="reabrirDisc(\''+t.id+'\',\''+d.id+'\');return false">reabrir</a>') : dd > 0 ? '<span class="bdg warn">Em andamento</span>' : '<span class="bdg">Não iniciada</span>')+'</td></tr>';
    }).join('')+'<tr><td colspan="2"><b>Total</b></td><td><b>'+totCarga+' h</b></td><td><b>'+totProg+' h</b></td><td><b>'+Object.values(hDada).reduce((a, b) => a + b, 0)+' h</b></td><td></td></tr></table></div>';

async function salvarAula(id, btn){
  const { t } = S.turma;
  const dados = { data: $('#auData').value, horas: Number($('#auHoras').value || 0), inicio: $('#auIni').value || null, fim: $('#auFim').value || null, disciplina_id: $('#auDisc').value || null, instrutor_id: $('#auInstId').value || null, instrutor: nomeInstrutor($('#auInstId').value) || $('#auInst').value.trim() || null, conteudo: $('#auCont').value.trim() || null };
  if(!dados.data || !(dados.horas > 0)) return toast('Informe a data e as horas-aula.', 'erro');
  const solta = travar(btn);
  try {
    if(id) await q(sb.from('aulas').update(dados).eq('id', id));
    else {
      const rep = $('#auRep').value, linhas = [Object.assign({ turma_id: t.id, escola_id: t.escola_id }, dados)];
      if(rep !== '0'){
        if(!t.fim) return toast('Informe o término da turma (Editar) para repetir as aulas.', 'erro');
        for(let d = addDias(dados.data, 1); d <= t.fim && linhas.length < 200; d = addDias(d, 1)){

          linhas.push(Object.assign({}, linhas[0], { data: d }));
        }
      }
      await q(sb.from('aulas').insert(linhas));
      if(linhas.length > 1) toast(linhas.length + ' aulas lançadas.');
    }
    fecharModal(); recarregar();
  } finally { solta(); }
}

  toast('Função atualizada. A pessoa precisa sair e entrar de novo no sistema.'); recarregar();
}
