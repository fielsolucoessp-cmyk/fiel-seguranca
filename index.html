<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>FIEL Segurança Privada</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#14213d;--navy2:#1f3260;--or:#f28c28;--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mut:#6b7488;--bd:#dfe3ec;--ok:#1f9d55;--warn:#b26f00;--bad:#d93636}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
a{color:var(--navy2)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:18px}.brand b{color:var(--or)}
header small{opacity:.75;font-size:12px;display:block}
header .usr{text-align:right;font-size:13px}
header a.hdr{display:inline-block;background:#1f9d55;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;text-decoration:none;margin-top:4px}
header button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;margin-top:4px}
nav{background:var(--navy2);display:flex;overflow-x:auto;gap:2px;padding:0 8px;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;color:#cfd6e6;padding:12px 14px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--or)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:20px}h3{margin:0 0 12px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer}
.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:26px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .sp{flex:1}
.btn{background:var(--or);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#e8ebf2;color:var(--tx)}.btn.nv{background:var(--navy)}.btn.dg{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.wa{background:#1f9d55}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff;color:var(--tx)}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fgrid .w{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.acoes .btn{margin:2px 0}
.mbox.grande{max-width:960px}
.visor{background:#eef1f6;border-radius:8px;overflow:auto;max-height:70vh;text-align:center}
.visor img{max-width:100%;height:auto;display:block;margin:0 auto}
.visor iframe{width:100%;height:68vh;border:0;display:block}
tr.click{cursor:pointer}tr.click:hover{background:#f7f9fc}
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#e8ebf2;color:var(--mut);white-space:nowrap}
.bdg.ok{background:#e1f4ea;color:var(--ok)}.bdg.warn{background:#fff1d6;color:var(--warn)}.bdg.bad{background:#fde4e4;color:var(--bad)}.bdg.nv{background:#e3e8f5;color:var(--navy2)}
.aviso{padding:10px 12px;border-radius:8px;margin-bottom:10px;background:#fff8ea;border-left:4px solid var(--or);font-size:14px}
.aviso.bad{background:#fdeeee;border-left-color:var(--bad)}.aviso.ok{background:#eaf7f0;border-left-color:var(--ok)}
.muted{color:var(--mut)}.small{font-size:13px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.passos div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:13px}
.passos b{color:var(--or);display:block;font-size:12px;text-transform:uppercase}
.sol{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.sol h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(10,18,40,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:620px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
#toast div.erro{background:var(--bad)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--navy2))}
.auth-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px}
.auth-box .brand{color:var(--navy);font-size:22px}
.tabs{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--or)}
.radio{display:flex;gap:8px;margin-bottom:12px}
.radio label{flex:1;border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.radio input{display:none}.radio label.on{border-color:var(--or);background:#fff5ec;color:var(--navy)}
.lgpd{font-size:12px;color:var(--mut);background:#f7f9fc;border-radius:8px;padding:10px;margin:6px 0 12px;max-height:120px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px}.chk input{width:auto;margin-top:3px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}main{padding:12px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= CONFIGURAÇÃO ================= */
const CONFIG = {
  SUPABASE_URL: 'https://qffqahrsmgqgxuzgrdsh.supabase.co',      // ex.: https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZnFhaHJzbWdxZ3h1emdyZHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODM5MTQsImV4cCI6MjEwNzc1OTkxNH0.VLJR5L7CHs5zVbNKkvkY7KEe5F-Vz_KQmoP3G2jAEI0',     // Project Settings > API > anon public
  ESCOLA: 'rondon'                                  // identificador da escola (tabela escolas.slug)
};
const VERSAO = '1.3.0';

/* ================= UTILITÁRIOS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soDig = s => String(s || '').replace(/\D/g, '');
function hojeISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1, d+n)); }
function addMeses(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1+n, d)); }
function dias(iso){ if(!iso) return null; const [a,m,d] = iso.slice(0,10).split('-').map(Number); const t = new Date(a,m-1,d); const h = new Date(); h.setHours(0,0,0,0); return Math.round((t-h)/864e5); }
function fmt(iso){ if(!iso) return '—'; const s = String(iso); if(s.length > 10){ const d = new Date(s); return d.toLocaleDateString('pt-BR'); } const [a,m,d] = s.split('-'); return d+'/'+m+'/'+a; }
function fmtDoc(v){ const d = soDig(v); if(d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); if(d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); return v || '—'; }
function cpfValido(v){
  const c = soDig(v); if(c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for(let t = 9; t < 11; t++){ let s = 0; for(let i = 0; i < t; i++) s += Number(c[i]) * (t+1-i); if(((s*10) % 11) % 10 !== Number(c[t])) return false; }
  return true;
}
function cnpjValido(v){
  const c = soDig(v); if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s = 0, p = n - 7; for(let i = 0; i < n; i++){ s += Number(c[i]) * p--; if(p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === Number(c[12]) && calc(13) === Number(c[13]);
}
function toast(msg, tipo){ const d = document.createElement('div'); if(tipo) d.className = tipo; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), tipo === 'erro' ? 6000 : 3500); }
function traduzErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  const mapa = [
    ['Invalid login credentials','E-mail ou senha incorretos.'],
    ['Email not confirmed','Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).'],
    ['User already registered','Este e-mail já está cadastrado.'],
    ['Password should be at least','A senha precisa ter pelo menos 8 caracteres.'],
    ['row-level security','Você não tem permissão para esta ação.'],
    ['For security purposes','Aguarde alguns segundos e tente de novo.'],
    ['Failed to fetch','Sem conexão com o servidor. Verifique sua internet.'],
    ['Payload too large','Arquivo muito grande (máximo 10 MB).'],
    ['mime type','Tipo de arquivo não aceito. Envie foto (JPG/PNG) ou PDF.']
  ];
  for(const [k, v] of mapa) if(m.includes(k)) return v;
  return m;
}
async function q(promise){ const { data, error } = await promise; if(error){ toast(traduzErro(error), 'erro'); try { error._mostrado = true; } catch(_){} throw error; } return data; }
async function buscarTodos(montar){ let out = [], i = 0; for(;;){ const d = await q(montar().range(i, i+999)); out = out.concat(d); if(d.length < 1000) break; i += 1000; } return out; }

/* ================= ESTADO ================= */
const SLUG = new URLSearchParams(location.search).get('escola') || CONFIG.ESCOLA;
let sb = null;
const S = { sessao:null, perfil:null, escola:null, cursos:[], empresas:{}, minhaPessoa:null, view:'', param:null, hist:[], msgs:{}, recovery:false, pessoa:null, busca:'' };
const staff = () => !!S.perfil && ['staff','admin'].includes(S.perfil.tipo);
const linkPortal = () => location.origin + location.pathname + (SLUG !== CONFIG.ESCOLA ? '?escola=' + encodeURIComponent(SLUG) : '');

const SOL = { rascunho:['Rascunho',''], enviada:['Aguardando análise','warn'], pendente:['Pendência — corrigir','bad'], aprovada:['Aprovada','ok'], matriculada:['Matriculado','nv'], concluida:['Concluída','ok'], reprovado:['Reprovado','bad'], recusada:['Recusada','bad'], cancelada:['Cancelada',''] };
const DOCST = { falta:['Não enviado',''], enviado:['Em análise','warn'], aprovado:['Aprovado','ok'], recusado:['Recusado','bad'], vencido:['Vencido','bad'] };
const bdg = (par) => '<span class="bdg '+par[1]+'">'+esc(par[0])+'</span>';
function bdgValidade(iso){ const d = dias(iso); if(d === null) return '<span class="bdg">—</span>'; if(d < 0) return '<span class="bdg bad">Vencido em '+fmt(iso)+'</span>'; if(d <= 30) return '<span class="bdg bad">Vence em '+d+' dia(s)</span>'; if(d <= 90) return '<span class="bdg warn">Vence em '+fmt(iso)+'</span>'; return '<span class="bdg ok">Válido até '+fmt(iso)+'</span>'; }
const parseDocs = c => (c && c.docs_exigidos || []).map(t => ({ nome: t.replace(/^\?/, '').trim(), opcional: t.startsWith('?') }));
const curso = id => S.cursos.find(c => c.id === id) || {};
function todosTiposDoc(){ const set = new Set(); S.cursos.forEach(c => parseDocs(c).forEach(d => set.add(d.nome))); set.add('Certificado de curso anterior'); set.add('Outro documento'); return [...set]; }

/* ================= MODAL ================= */
function abrirModal(titulo, corpo, botoes){
  $('#modal').innerHTML = '<div class="mbox"><h3>'+esc(titulo)+'</h3>'+corpo+'<div class="mact">'+(botoes || '')+'<button class="btn sec" onclick="fecharModal()">Fechar</button></div></div>';
  $('#modal').classList.add('on');
}
function fecharModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') fecharModal(); });
function travar(btn, txt){ if(!btn) return () => {}; const o = btn.textContent; btn.disabled = true; btn.textContent = txt || 'Aguarde...'; return () => { btn.disabled = false; btn.textContent = o; }; }

/* ================= INÍCIO ================= */
async function iniciar(){
  if(!window.supabase || CONFIG.SUPABASE_URL.startsWith('COLE')){
    $('#app').innerHTML = '<div class="auth"><div class="auth-box"><div class="brand">FIEL <b style="color:var(--or)">Segurança Privada</b></div><p>Sistema ainda não configurado.</p><p class="muted small">Preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do arquivo index.html.</p></div></div>';
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data: escola } = await sb.from('escolas').select('*').eq('slug', SLUG).maybeSingle();
  S.escola = escola;
  sb.auth.onAuthStateChange((ev, sessao) => {
    if(ev === 'PASSWORD_RECOVERY'){ S.recovery = true; telaAuth('nova'); return; }
    if(ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED'){ S.sessao = sessao; return; }
    setTimeout(() => entrar(sessao), 0);
  });
}

async function entrar(sessao){
  if(S.recovery) return telaAuth('nova');
  if(!sessao){ S.sessao = null; S.perfil = null; return telaAuth('entrar'); }
  if(S.perfil && S.sessao && S.sessao.user.id === sessao.user.id){ S.sessao = sessao; return; }
  S.sessao = sessao;
  try {
    const perfil = await q(sb.from('perfis').select('*').eq('id', sessao.user.id).maybeSingle());
    if(!perfil){ $('#app').innerHTML = '<div class="auth"><div class="auth-box"><p>Seu cadastro não foi encontrado. Fale com a escola.</p><button class="btn" onclick="sair()">Sair</button></div></div>'; return; }
    S.perfil = perfil;
    if(!S.escola || S.escola.id !== perfil.escola_id) S.escola = await q(sb.from('escolas').select('*').eq('id', perfil.escola_id).single());
    await carregarCursos();
    if(staff()) await carregarEmpresas();
    if(perfil.tipo === 'aluno'){ const p = await q(sb.from('pessoas').select('id').eq('usuario_id', perfil.id).limit(1)); S.minhaPessoa = p[0] ? p[0].id : null; }
    S.hist = [];
    if(staff()) go('painel', null, false);
    else if(perfil.tipo === 'empresa') go('vigilantes', null, false);
    else go('pessoa', S.minhaPessoa, false);
  } catch(e){ console.error(e); }
}
async function carregarCursos(){ S.cursos = await q(sb.from('cursos').select('*').eq('escola_id', S.perfil.escola_id).order('sigla')); }
async function carregarEmpresas(){ const l = await q(sb.from('perfis').select('id,nome,cpf_cnpj,telefone,email').eq('tipo','empresa').eq('escola_id', S.perfil.escola_id).order('nome')); S.empresas = {}; l.forEach(e => S.empresas[e.id] = e); }
async function sair(){ await sb.auth.signOut(); S.perfil = null; S.sessao = null; telaAuth('entrar'); }

/* ================= LOGIN / CADASTRO ================= */
function telaAuth(aba){
  const nomeEscola = S.escola ? S.escola.nome : '';
  const abas = aba === 'nova' ? '' : '<div class="tabs"><button class="'+(aba==='entrar'?'on':'')+'" onclick="telaAuth(\'entrar\')">Entrar</button><button class="'+(aba==='cadastro'?'on':'')+'" onclick="telaAuth(\'cadastro\')">Criar conta</button></div>';
  let corpo = '';
  if(aba === 'entrar') corpo =
    '<label class="f"><span>E-mail ou CPF/CNPJ</span><input id="aEmail" autocomplete="username"></label>'+
    '<label class="f"><span>Senha</span><input id="aSenha" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')fazerLogin(this)"></label>'+
    '<button class="btn" style="width:100%" onclick="fazerLogin(this)">Entrar</button>'+
    '<p style="text-align:center;margin:14px 0 0"><a href="#" onclick="telaAuth(\'esqueci\');return false">Esqueci minha senha</a></p>';
  if(aba === 'cadastro') corpo =
    '<div class="radio"><label id="rAluno" class="on" onclick="tipoCad(\'aluno\')">Sou aluno / vigilante</label><label id="rEmpresa" onclick="tipoCad(\'empresa\')">Sou empresa</label></div>'+
    '<label class="f"><span id="lNome">Nome completo</span><input id="cNome"></label>'+
    '<label class="f"><span id="lDoc">CPF</span><input id="cDoc" inputmode="numeric"></label>'+
    '<label class="f"><span>Telefone / WhatsApp</span><input id="cTel" inputmode="tel" placeholder="(66) 99999-9999"></label>'+
    '<label class="f"><span>E-mail</span><input id="cEmail" type="email" autocomplete="email"></label>'+
    '<label class="f"><span>Senha (mínimo 8 caracteres)</span><input id="cSenha" type="password" autocomplete="new-password"></label>'+
    '<label class="f"><span>Repita a senha</span><input id="cSenha2" type="password" autocomplete="new-password"></label>'+
    '<div class="lgpd" id="txtLgpd">'+textoLgpd('aluno')+'</div>'+
    '<label class="chk"><input type="checkbox" id="cLgpd"> <span>Li e concordo com o tratamento dos meus dados descrito acima.</span></label>'+
    '<button class="btn" style="width:100%" onclick="fazerCadastro(this)">Criar conta</button>';
  if(aba === 'esqueci') corpo =
    '<p class="small muted">Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p>'+
    '<label class="f"><span>E-mail</span><input id="rEmail" type="email"></label>'+
    '<button class="btn" style="width:100%" onclick="pedirNovaSenha(this)">Enviar link</button>'+
    '<p style="text-align:center;margin:14px 0 0"><a href="#" onclick="telaAuth(\'entrar\');return false">Voltar</a></p>';
  if(aba === 'nova') corpo =
    '<h3 style="margin-top:16px">Criar nova senha</h3>'+
    '<label class="f"><span>Nova senha (mínimo 8 caracteres)</span><input id="nSenha" type="password" autocomplete="new-password"></label>'+
    '<label class="f"><span>Repita a nova senha</span><input id="nSenha2" type="password" autocomplete="new-password"></label>'+
    '<button class="btn" style="width:100%" onclick="salvarNovaSenha(this)">Salvar nova senha</button>';
  $('#app').innerHTML = '<div class="auth"><div class="auth-box"><div class="brand">FIEL <b>Segurança Privada</b></div><div class="muted">'+esc(nomeEscola)+' · Portal do aluno e da empresa</div>'+abas+corpo+'</div></div>';
  S.tipoCad = 'aluno';
}
function textoLgpd(tipo){
  const escola = S.escola ? S.escola.nome : 'a escola';
  let t = 'Autorizo '+esc(escola)+' a coletar e tratar meus dados pessoais e os documentos que eu enviar, inclusive dados sensíveis (certidões de antecedentes, exames de saúde e avaliação psicológica), exclusivamente para: análise de matrícula, cumprimento das exigências da Polícia Federal e da legislação de segurança privada, emissão de certificados e aviso de vencimento de cursos. Os arquivos ficam em armazenamento privado e só são acessados pela equipe da escola. Os dados serão mantidos pelo prazo exigido pelas normas aplicáveis, e posso pedir acesso, correção ou exclusão pelos canais de atendimento da escola (Lei nº 13.709/2018 – LGPD).';
  if(tipo === 'empresa') t += ' Como empresa, declaro que tenho autorização dos colaboradores que eu cadastrar para enviar seus dados e documentos à escola.';
  return t;
}
function tipoCad(t){
  S.tipoCad = t;
  $('#rAluno').classList.toggle('on', t === 'aluno'); $('#rEmpresa').classList.toggle('on', t === 'empresa');
  $('#lNome').textContent = t === 'empresa' ? 'Razão social / nome da empresa' : 'Nome completo';
  $('#lDoc').textContent = t === 'empresa' ? 'CNPJ' : 'CPF';
  $('#txtLgpd').innerHTML = textoLgpd(t);
}
async function fazerLogin(btn){

/* ================= ARQUIVOS ================= */
async function prepararArquivo(file){
  if(file.type === 'application/pdf'){ if(file.size > 10*1024*1024) throw new Error('PDF maior que 10 MB.'); return { blob: file, ext: 'pdf', tipo: 'application/pdf' }; }
  if(!file.type.startsWith('image/')) throw new Error('Envie uma foto (JPG/PNG) ou um PDF.');
  const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('Não foi possível ler a imagem. Tente JPG ou PDF.')); i.src = URL.createObjectURL(file); });
  const max = 1800, f = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
  return { blob, ext: 'jpg', tipo: 'image/jpeg' };
}
async function subirArquivo(pessoa, file){
  const arq = await prepararArquivo(file);
  const path = pessoa.escola_id + '/' + pessoa.id + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + arq.ext;
  await q(sb.storage.from('documentos').upload(path, arq.blob, { contentType: arq.tipo, upsert: false }));
  return path;
}

  if(error) return toast(traduzErro(error), 'erro');

  let corpo = '<div class="visor">' + (pdf ? '<iframe src="'+esc(url)+'" title="Documento"></iframe>' : '<img src="'+esc(url)+'" alt="Documento enviado">') + '</div>';
  if(d) corpo += '<div class="small muted" style="margin-top:8px">'+(S.pessoa.p ? esc(S.pessoa.p.nome)+' · ' : '')+'Enviado em '+fmt(d.enviado_em)+(d.validade ? ' · validade '+fmt(d.validade) : '')+' · '+DOCST[estadoDoc(d)][0]+'</div>';
  let botoes = '<a class="btn sec" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir em nova aba</a>';

      (d.status !== 'aprovado' ? '<button class="btn ok" onclick="aprovarNoVisor(\''+d.id+'\',this)">'+(outros ? 'Aprovar e próximo ('+outros+')' : 'Aprovar')+'</button>' : '') + botoes;

  $('.mbox').classList.add('grande');

async function importar(btn, empresaId){
  const linhas = $('#imTxt').value.split('\n').map(l => l.trim()).filter(Boolean);
  const ok = [], erros = [];

    else ok.push({ escola_id: S.perfil.escola_id, empresa_id: empresaId && empresaId !== 'null' ? empresaId : null, nome: c[0], cpf, telefone: c[2] || null, email: c[3] || null });

  if(!ok.length) return toast(erros[0] || 'Nada para importar.', 'erro');
  const solta = travar(btn, 'Importando...');
  try {
    await q(sb.from('pessoas').insert(ok));

  } finally { solta(); }

/* ================= TELA: VENCIMENTOS ================= */
async function vVencimentos(){
  const hoje = hojeISO();
  const linhas = await buscarTodos(() => sb.from('v_validades').select('*').lte('vence_em', addDias(hoje, 120)).gte('vence_em', addDias(hoje, -365)).order('vence_em'));
  let ultimos = {};
  if(staff() && linhas.length){
    const ids = [...new Set(linhas.map(l => l.pessoa_id))];
    for(let i = 0; i < ids.length; i += 150){
      const av = await q(sb.from('avisos').select('pessoa_id,enviado_em,canal').in('pessoa_id', ids.slice(i, i+150)).order('enviado_em', { ascending: false }));
      av.forEach(a => { if(!ultimos[a.pessoa_id]) ultimos[a.pessoa_id] = a; });
    }
  }
  const grupos = [['Vencidos (último ano)', l => dias(l.vence_em) < 0], ['Vencem em até 30 dias', l => dias(l.vence_em) >= 0 && dias(l.vence_em) <= 30], ['Vencem de 31 a 120 dias', l => dias(l.vence_em) > 30]];
  let h = '<h2>Vencimentos de cursos</h2>';
  if(!linhas.length) return h + '<div class="card"><p class="muted">Nenhum curso vencido ou vencendo nos próximos 120 dias.</p><p class="small muted">A validade é calculada a partir dos cursos concluídos registrados em cada cadastro.</p></div>';
  grupos.forEach(([titulo, filtro]) => {
    const g = linhas.filter(filtro); if(!g.length) return;

  const t = id && S.turma && S.turma.t.id === id ? S.turma.t : { codigo:'', curso_id: (S.cursos.find(c => c.ativo) || S.cursos[0] || {}).id, inicio:'', fim:'', turno:'', local:'', vagas:'', instrutores:'', status:'planejada', obs:'' };
  const sel = (v, ops) => ops.map(([k, l]) => '<option value="'+esc(k)+'"'+(String(k) === String(v || '') ? ' selected' : '')+'>'+esc(l)+'</option>').join('');
  abrirModal(id ? 'Editar turma' : 'Nova turma', '<div class="fgrid">'+
    '<label class="f"><span>Curso</span><select id="tuCurso" '+(id ? 'disabled' : '')+' onchange="sugerirCodigo()">'+sel(t.curso_id, S.cursos.map(c => [c.id, c.sigla+' — '+c.nome]))+'</select></label>'+
    '<label class="f"><span>Código da turma</span><input id="tuCod" value="'+esc(t.codigo)+'" placeholder="ex.: CFV-2026-01"></label>'+
    '<label class="f"><span>Início</span><input id="tuIni" type="date" value="'+esc(t.inicio)+'"></label>'+
    '<label class="f"><span>Término</span><input id="tuFim" type="date" value="'+esc(t.fim)+'"></label>'+
    '<label class="f"><span>Turno</span><select id="tuTurno">'+sel(t.turno, [['','—']].concat(TURNOS.map(x => [x, x])))+'</select></label>'+
    '<label class="f"><span>Vagas</span><input id="tuVagas" type="number" min="1" value="'+esc(t.vagas)+'"></label>'+
    '<label class="f w"><span>Local / sala</span><input id="tuLocal" value="'+esc(t.local)+'"></label>'+
    '<label class="f w"><span>Instrutores</span><input id="tuInst" value="'+esc(t.instrutores)+'" placeholder="nomes separados por vírgula"></label>'+
    '<label class="f"><span>Situação</span><select id="tuSt" '+(t.status === 'concluida' ? 'disabled' : '')+'>'+sel(t.status, Object.entries(TST).filter(([k]) => k !== 'concluida' || t.status === 'concluida').map(([k, v]) => [k, v[0]]))+'</select></label>'+
    '<label class="f w"><span>Observações</span><textarea id="tuObs" rows="2">'+esc(t.obs)+'</textarea></label></div>',
    '<button class="btn" onclick="salvarTurma(\''+(id || '')+'\',this)">Salvar</button>');
  if(!id) sugerirCodigo();
}
async function sugerirCodigo(){
  const c = curso($('#tuCurso').value), ano = hojeISO().slice(0, 4);
  const { count } = await sb.from('turmas').select('id', { count: 'exact', head: true }).eq('curso_id', c.id).gte('inicio', ano + '-01-01');
  const el = $('#tuCod'); if(el && (!el.value || el.dataset.auto)){ el.value = (c.sigla || 'TURMA') + '-' + ano + '-' + String((count || 0) + 1).padStart(2, '0'); el.dataset.auto = '1'; }
}
async function salvarTurma(id, btn){
  const dados = { codigo: $('#tuCod').value.trim(), inicio: $('#tuIni').value || null, fim: $('#tuFim').value || null, turno: $('#tuTurno').value || null, local: $('#tuLocal').value.trim() || null, vagas: $('#tuVagas').value ? Number($('#tuVagas').value) : null, instrutores: $('#tuInst').value.trim() || null, obs: $('#tuObs').value.trim() || null };
  if(!$('#tuSt').disabled) dados.status = $('#tuSt').value;
  if(!dados.codigo) return toast('Informe o código da turma.', 'erro');
  if(dados.inicio && dados.fim && dados.fim < dados.inicio) return toast('O término não pode ser antes do início.', 'erro');
  const solta = travar(btn);
  try {
    if(id){ await q(sb.from('turmas').update(dados).eq('id', id)); fecharModal(); toast('Turma salva.'); recarregar(); }
    else { const nova = await q(sb.from('turmas').insert(Object.assign({ escola_id: S.perfil.escola_id, curso_id: $('#tuCurso').value }, dados)).select('id').single()); fecharModal(); toast('Turma criada.'); go('turma', nova.id); }
  } finally { solta(); }
}
async function vTurma(id){
  const t = await q(sb.from('turmas').select('*, cursos(sigla,nome)').eq('id', id).single());
  const [mats, disp] = await Promise.all([
    q(sb.from('solicitacoes').select('id,status,frequencia,nota,resultado,pessoa_id,pessoas(nome,cpf,rg,nascimento,sexo,escolaridade,telefone,email,endereco,empresa_id)').eq('turma_id', id)),
    q(sb.from('solicitacoes').select('id,pessoa_id,criado_em,pessoas(nome,cpf,empresa_id)').eq('escola_id', t.escola_id).eq('curso_id', t.curso_id).eq('status', 'aprovada').is('turma_id', null))
  ]);
  mats.sort((a, b) => (a.pessoas ? a.pessoas.nome : '').localeCompare(b.pessoas ? b.pessoas.nome : ''));
  S.turma = { t, mats };
  const fechada = t.status === 'concluida' || t.status === 'cancelada';
  const emp = id => id && S.empresas[id] ? S.empresas[id].nome : 'Particular';
  let h = '<div class="bar">'+btnVoltar()+'<h2 style="margin:0">'+esc(t.codigo)+' '+bdg(TST[t.status])+'</h2><span class="sp"></span>'+
    '<button class="btn sec sm" onclick="modalTurma(\''+t.id+'\')">Editar</button><button class="btn nv sm" onclick="exportarTurma()">Planilha para o GESP</button><button class="btn nv sm" onclick="listaPresenca()">Lista de presença</button>'+
    (fechada ? '' : '<button class="btn ok sm" onclick="concluirTurma(\''+t.id+'\',this)">Concluir turma</button>')+'</div>';
  h += '<div class="card"><div class="kpis" style="margin:0">'+
    '<div class="kpi" style="cursor:default"><span>Curso</span><b style="font-size:18px">'+esc(t.cursos ? t.cursos.sigla : '')+'</b><span>'+esc(t.cursos ? t.cursos.nome : '')+'</span></div>'+
    '<div class="kpi" style="cursor:default"><span>Período</span><b style="font-size:18px">'+fmt(t.inicio)+' a '+fmt(t.fim)+'</b><span>'+esc(t.turno || '')+'</span></div>'+
    '<div class="kpi" style="cursor:default"><span>Alunos</span><b>'+mats.length+(t.vagas ? '<span style="font-size:15px"> / '+t.vagas+' vagas</span>' : '')+'</b></div>'+
    '<div class="kpi" style="cursor:default"><span>Local · Instrutores</span><b style="font-size:15px">'+esc(t.local || '—')+'</b><span>'+esc(t.instrutores || '—')+'</span></div></div></div>';
  const g = [['gesp_inicio','Início do curso comunicado no GESP'],['gesp_alunos','Alunos cadastrados no GESP'],['gesp_conclusao','Conclusão comunicada no GESP']];
  h += '<div class="card"><h3>Checklist GESP</h3>'+g.map(([k, l]) => '<label class="chk" style="font-size:15px;padding:6px 0;border-bottom:1px dashed var(--bd);margin:0"><input type="checkbox"'+(t[k] ? ' checked' : '')+' onchange="marcarGesp(\''+t.id+'\',\''+k+'\',this.checked)"> <span style="flex:1">'+l+'</span>'+(t[k] ? '<span class="small muted">em '+fmt(t[k])+'</span>' : '')+'</label>').join('')+'</div>';
  const ap = mats.filter(m => m.resultado === 'aprovado').length, rp = mats.filter(m => m.resultado === 'reprovado').length;
  h += '<div class="card"><div class="bar"><h3 style="margin:0">Alunos da turma ('+mats.length+')</h3><span class="sp"></span><span class="small muted">'+ap+' aprovado(s) · '+rp+' reprovado(s) · '+(mats.length - ap - rp)+' sem resultado</span></div>';
  h += mats.length ? '<div class="tw"><table><tr><th>Nome</th><th>CPF</th><th>Empresa</th><th>Freq. %</th><th>Nota</th><th>Resultado</th><th>Situação</th><th></th></tr>'+mats.map(m => {
    const p = m.pessoas || {}, dis = fechada || m.status !== 'matriculada' ? ' disabled' : '';
    return '<tr><td><a href="#" onclick="go(\'pessoa\',\''+m.pessoa_id+'\');return false"><b>'+esc(p.nome)+'</b></a></td><td>'+fmtDoc(p.cpf)+'</td><td class="small">'+esc(emp(p.empresa_id))+'</td>'+
      '<td><input type="number" min="0" max="100" step="0.1" style="width:80px" value="'+esc(m.frequencia ?? '')+'"'+dis+' onchange="salvarMat(\''+m.id+'\',\'frequencia\',this.value)"></td>'+
      '<td><input type="number" min="0" max="10" step="0.1" style="width:80px" value="'+esc(m.nota ?? '')+'"'+dis+' onchange="salvarMat(\''+m.id+'\',\'nota\',this.value)"></td>'+
      '<td><select style="width:130px"'+dis+' onchange="salvarMat(\''+m.id+'\',\'resultado\',this.value)"><option value="">—</option><option value="aprovado"'+(m.resultado === 'aprovado' ? ' selected' : '')+'>Aprovado</option><option value="reprovado"'+(m.resultado === 'reprovado' ? ' selected' : '')+'>Reprovado</option></select></td>'+
      '<td>'+bdg(SOL[m.status] || ['—',''])+'</td><td>'+(dis ? '' : '<button class="btn sec sm" title="Tirar da turma" onclick="tirarDaTurma(\''+m.id+'\')">✕</button>')+'</td></tr>';
  }).join('')+'</table></div>' : '<p class="muted">Nenhum aluno nesta turma ainda.</p>';
  h += '</div>';
  if(!fechada){
    const livres = t.vagas ? Math.max(0, t.vagas - mats.length) : null;
    h += '<div class="card"><div class="bar"><h3 style="margin:0">Adicionar alunos aprovados ('+disp.length+')</h3><span class="sp"></span>'+(livres !== null ? '<span class="small muted">'+livres+' vaga(s) livre(s)</span>' : '')+'</div>';
    h += disp.length ? '<p class="small muted" style="margin-top:0">Alunos com pré-matrícula <b>aprovada</b> neste curso e ainda sem turma.</p><div class="tw"><table><tr><th><input type="checkbox" onclick="document.querySelectorAll(\'.selMat\').forEach(c=>c.checked=this.checked)"></th><th>Nome</th><th>CPF</th><th>Empresa</th><th>Pré-matrícula</th></tr>'+disp.map(d => '<tr><td><input type="checkbox" class="selMat" value="'+d.id+'"></td><td>'+esc(d.pessoas ? d.pessoas.nome : '')+'</td><td>'+fmtDoc(d.pessoas ? d.pessoas.cpf : '')+'</td><td class="small">'+esc(emp(d.pessoas && d.pessoas.empresa_id))+'</td><td>'+fmt(d.criado_em)+'</td></tr>').join('')+'</table></div><button class="btn" style="margin-top:10px" onclick="matricularSel(\''+t.id+'\',this)">Matricular selecionados</button>'
      : '<p class="muted">Nenhum aluno aprovado aguardando turma neste curso.</p>';
    h += '</div>';
  }
  if(t.obs) h += '<p class="small muted">Obs.: '+esc(t.obs)+'</p>';
  return h;
}
async function marcarGesp(id, campo, marcado){ await q(sb.from('turmas').update({ [campo]: marcado ? hojeISO() : null }).eq('id', id)); recarregar(); }
async function salvarMat(id, campo, valor){
  let v = valor === '' ? null : valor;
  if(v !== null && campo !== 'resultado'){ v = Number(String(v).replace(',', '.')); const max = campo === 'frequencia' ? 100 : 10; if(isNaN(v) || v < 0 || v > max) return toast('Valor inválido (0 a '+max+').', 'erro'); }
  await q(sb.from('solicitacoes').update({ [campo]: v }).eq('id', id));
  const m = S.turma.mats.find(x => x.id === id); if(m) m[campo] = v;
  if(campo === 'resultado') recarregar(); else toast('Salvo.');
}
async function matricularSel(turmaId, btn){
  const ids = [...document.querySelectorAll('.selMat:checked')].map(c => c.value);
  if(!ids.length) return toast('Selecione pelo menos um aluno.', 'erro');
  const t = S.turma.t;
  if(t.vagas && S.turma.mats.length + ids.length > t.vagas && !confirm('Isso passa do limite de '+t.vagas+' vagas. Matricular mesmo assim?')) return;
  const solta = travar(btn, 'Matriculando...');
  try { await q(sb.from('solicitacoes').update({ turma_id: turmaId, status: 'matriculada' }).in('id', ids)); toast(ids.length+' aluno(s) matriculado(s).'); recarregar(); } finally { solta(); }
}
async function tirarDaTurma(id){
  if(!confirm('Tirar este aluno da turma? Ele volta para a lista de aprovados aguardando turma.')) return;
  await q(sb.from('solicitacoes').update({ turma_id: null, status: 'aprovada', frequencia: null, nota: null, resultado: null }).eq('id', id));
  recarregar();
}
async function concluirTurma(id, btn){
  const { t, mats } = S.turma;
  const ativos = mats.filter(m => m.status === 'matriculada'), sem = ativos.filter(m => !m.resultado).length;
  if(!t.fim) return toast('Informe a data de término da turma (Editar) antes de concluir.', 'erro');
  if(!ativos.length) return toast('Não há alunos matriculados nesta turma.', 'erro');
  if(sem) return toast('Defina o resultado de todos os alunos. Faltam '+sem+'.', 'erro');
  const ap = ativos.filter(m => m.resultado === 'aprovado').length;
  if(!confirm('Concluir a turma '+t.codigo+'?\n\n'+ap+' aprovado(s) receberão o curso concluído em '+fmt(t.fim)+' (com cálculo de validade).\n'+(ativos.length - ap)+' reprovado(s).\n\nEssa ação não pode ser desfeita.')) return;
  const solta = travar(btn, 'Concluindo...');
  try { const r = await q(sb.rpc('concluir_turma', { p_turma: id })); toast('Turma concluída: '+r.aprovados+' aprovado(s), '+r.reprovados+' reprovado(s).'); recarregar(); } finally { solta(); }
}
function baixarArquivo(nome, conteudo, tipo){ const b = new Blob([conteudo], { type: tipo }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportarTurma(){
  const { t, mats } = S.turma; if(!mats.length) return toast('Turma sem alunos.', 'erro');
  const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const linhas = [['Nº','Nome','CPF','RG','Data de nascimento','Sexo','Escolaridade','Telefone','E-mail','Endereço','Empresa','Frequência %','Nota','Resultado']].concat(mats.map((m, i) => { const p = m.pessoas || {}; return [i + 1, p.nome, fmtDoc(p.cpf), p.rg, p.nascimento ? fmt(p.nascimento) : '', p.sexo, p.escolaridade, p.telefone, p.email, p.endereco, p.empresa_id && S.empresas[p.empresa_id] ? S.empresas[p.empresa_id].nome : '', m.frequencia, m.nota, m.resultado ? (m.resultado === 'aprovado' ? 'Aprovado' : 'Reprovado') : '']; }));
  baixarArquivo('turma_' + t.codigo.replace(/[^\w-]+/g, '_') + '.csv', '﻿' + linhas.map(l => l.map(c).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
function imprimir(html){
  let f = document.getElementById('pframe');
  if(!f){ f = document.createElement('iframe'); f.id = 'pframe'; f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0'; document.body.appendChild(f); }
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); }, 400);
}
function listaPresenca(){
  const { t, mats } = S.turma; if(!mats.length) return toast('Turma sem alunos.', 'erro');
  imprimir('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lista de presença</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:18px}h2,p{margin:3px 0}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #777;padding:7px 5px;text-align:left}th{background:#eee}</style></head><body>'+
    '<h2>'+esc(S.escola ? S.escola.nome : '')+'</h2><p><b>Lista de presença — '+esc(t.cursos ? t.cursos.sigla + ' — ' + t.cursos.nome : '')+'</b></p>'+
    '<p>Turma: <b>'+esc(t.codigo)+'</b> · Período: '+fmt(t.inicio)+' a '+fmt(t.fim)+(t.turno ? ' · '+esc(t.turno) : '')+(t.local ? ' · '+esc(t.local) : '')+'</p>'+
    '<p>Data: ____/____/________ · Disciplina: ______________________________ · Instrutor: ______________________________</p>'+
    '<table><tr><th style="width:30px">Nº</th><th>Nome</th><th style="width:120px">CPF</th><th style="width:240px">Assinatura</th></tr>'+mats.map((m, i) => '<tr><td>'+(i + 1)+'</td><td>'+esc(m.pessoas ? m.pessoas.nome : '')+'</td><td>'+fmtDoc(m.pessoas ? m.pessoas.cpf : '')+'</td><td></td></tr>').join('')+'</table></body></html>');
}

const FUNCAO = { admin: 'Administrador', staff: 'Equipe da escola', aluno: 'Aluno', empresa: 'Empresa' };
async function vEquipe(){
  if(S.perfil.tipo !== 'admin') return '<div class="card">Somente o administrador acessa esta tela.</div>';
  const lista = await q(sb.from('perfis').select('id,nome,email,tipo').eq('escola_id', S.perfil.escola_id).in('tipo', ['staff','admin']).order('nome'));
  return '<h2>Equipe da escola</h2><div class="card"><div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Função</th><th></th></tr>'+lista.map(u => '<tr><td><b>'+esc(u.nome || '—')+'</b>'+(u.id === S.perfil.id ? ' <span class="bdg nv">você</span>' : '')+'</td><td>'+esc(u.email)+'</td><td>'+esc(FUNCAO[u.tipo])+'</td><td class="acoes">'+(u.id === S.perfil.id ? '' :
    (u.tipo === 'staff' ? '<button class="btn sec sm" onclick="definirFuncao(\''+u.id+'\',\'admin\')">Tornar administrador</button> ' : '<button class="btn sec sm" onclick="definirFuncao(\''+u.id+'\',\'staff\')">Tornar equipe</button> ')+
    '<button class="btn dg sm" onclick="definirFuncao(\''+u.id+'\',\'aluno\')">Remover acesso</button>')+'</td></tr>').join('')+'</table></div>'+
    '<p class="small muted"><b>Administrador</b> faz tudo, inclusive gerenciar a equipe. <b>Equipe da escola</b> analisa documentos, pré-matrículas, cursos e vencimentos.</p></div>'+
    '<div class="card"><h3>Adicionar pessoa à equipe</h3><p class="small muted" style="margin-top:0">1. Peça para a pessoa criar uma conta pelo link do portal (Painel → Link do portal).<br>2. Busque pelo e-mail que ela usou e defina a função.</p>'+
    '<div class="bar"><input id="eqEmail" type="email" placeholder="e-mail da pessoa" style="flex:1" onkeydown="if(event.key===\'Enter\')buscarEquipe()"><button class="btn nv" onclick="buscarEquipe()">Buscar</button></div><div id="eqRes"></div></div>';
}
async function buscarEquipe(){
  const e = $('#eqEmail').value.trim().toLowerCase().replace(/[,()%]/g, '');
  if(!e) return;
  const r = await q(sb.from('perfis').select('id,nome,email,tipo').eq('escola_id', S.perfil.escola_id).ilike('email', e).limit(5));
  $('#eqRes').innerHTML = r.length ? r.map(u => '<div class="aviso" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>'+esc(u.nome || '—')+'</b> · '+esc(u.email)+' · hoje: '+esc(FUNCAO[u.tipo])+'</div>'+(u.id === S.perfil.id ? '' :
    (u.tipo !== 'staff' ? '<button class="btn sm" onclick="definirFuncao(\''+u.id+'\',\'staff\')">Tornar equipe</button>' : '')+(u.tipo !== 'admin' ? '<button class="btn nv sm" onclick="definirFuncao(\''+u.id+'\',\'admin\')">Tornar administrador</button>' : ''))+'</div>').join('')
    : '<div class="aviso bad">Nenhuma conta com esse e-mail nesta escola. Confira o e-mail ou peça para a pessoa criar a conta pelo link do portal.</div>';
}
async function definirFuncao(id, tipo){
  if(id === S.perfil.id) return toast('Você não pode alterar a sua própria função.', 'erro');
  const msg = { admin: 'Dar acesso de ADMINISTRADOR a esta pessoa?', staff: 'Dar acesso de EQUIPE DA ESCOLA a esta pessoa?', aluno: 'Remover o acesso desta pessoa ao painel da escola? A conta continua existindo como aluno.' }[tipo];
  if(!confirm(msg)) return;
  await q(sb.from('perfis').update({ tipo }).eq('id', id));
  toast('Função atualizada. A pessoa precisa sair e entrar de novo no sistema.'); recarregar();
}

const VIEWS = { turmas: vTurmas, turma: vTurma, equipe: vEquipe, pessoa: vPessoa, vigilantes: vVigilantes, vencimentos: vVencimentos, painel: vPainel, analise: vAnalise, pessoas: vPessoas, empresas: vEmpresas, cursos: vCursos, escola: vEscola, conta: vConta };

/* recarrega a tela ao fechar o aviso pós-análise */
const _fechar = fecharModal;
fecharModal = function(){ _fechar(); if(S._recarregarAoFechar){ S._recarregarAoFechar = false; recarregar(); } };

iniciar();
</script>
