<style>

tr.click{cursor:pointer}tr.click:hover{background:#f7f9fc}

.muted{color:var(--mut)}.small{font-size:13px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.passos div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:13px}
.passos b{color:var(--or);display:block;font-size:12px;text-transform:uppercase}
.sol{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.sol h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(10,18,40,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}

.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:620px}

#toast div{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
#toast div.erro{background:var(--bad)}

.auth-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px}

.tabs button.on{color:var(--navy);border-bottom-color:var(--or)}
.radio{display:flex;gap:8px;margin-bottom:12px}
.radio label{flex:1;border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.radio input{display:none}.radio label.on{border-color:var(--or);background:#fff5ec;color:var(--navy)}
.lgpd{font-size:12px;color:var(--mut);background:#f7f9fc;border-radius:8px;padding:10px;margin:6px 0 12px;max-height:120px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px}.chk input{width:auto;margin-top:3px}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= CONFIGURAÇÃO ================= */
const CONFIG = {
  SUPABASE_URL: 'https://qffqahrsmgqgxuzgrdsh.supabase.co',      // ex.: https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZnFhaHJzbWdxZ3h1emdyZHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODM5MTQsImV4cCI6MjEwNzc1OTkxNH0.VLJR5L7CHs5zVbNKkvkY7KEe5F-Vz_KQmoP3G2jAEI0',     // Project Settings > API > anon public
  ESCOLA: 'rondon'                                  // identificador da escola (tabela escolas.slug)
};
const VERSAO = '1.12.0';

/* ================= UTILITÁRIOS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soDig = s => String(s || '').replace(/\D/g, '');
function hojeISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1, d+n)); }
function addMeses(iso, n){ const [a,m,d] = iso.split('-').map(Number); return isoDe(new Date(a, m-1+n, d)); }
function dias(iso){ if(!iso) return null; const [a,m,d] = iso.slice(0,10).split('-').map(Number); const t = new Date(a,m-1,d); const h = new Date(); h.setHours(0,0,0,0); return Math.round((t-h)/864e5); }
function fmt(iso){ if(!iso) return '—'; const s = String(iso); if(s.length > 10){ const d = new Date(s); return d.toLocaleDateString('pt-BR'); } const [a,m,d] = s.split('-'); return d+'/'+m+'/'+a; }
function fmtDoc(v){ const d = soDig(v); if(d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); if(d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); return v || '—'; }
function cpfValido(v){
  const c = soDig(v); if(c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for(let t = 9; t < 11; t++){ let s = 0; for(let i = 0; i < t; i++) s += Number(c[i]) * (t+1-i); if(((s*10) % 11) % 10 !== Number(c[t])) return false; }
  return true;
}
function cnpjValido(v){
  const c = soDig(v); if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s = 0, p = n - 7; for(let i = 0; i < n; i++){ s += Number(c[i]) * p--; if(p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === Number(c[12]) && calc(13) === Number(c[13]);
}
function toast(msg, tipo){ const d = document.createElement('div'); if(tipo) d.className = tipo; d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), tipo === 'erro' ? 6000 : 3500); }
function traduzErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  const mapa = [
    ['Invalid login credentials','E-mail ou senha incorretos.'],
    ['Email not confirmed','Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).'],
    ['User already registered','Este e-mail já está cadastrado.'],
    ['Password should be at least','A senha precisa ter pelo menos 8 caracteres.'],
    ['row-level security','Você não tem permissão para esta ação.'],
    ['For security purposes','Aguarde alguns segundos e tente de novo.'],
    ['Failed to fetch','Sem conexão com o servidor. Verifique sua internet.'],
    ['Payload too large','Arquivo muito grande (máximo 10 MB).'],
    ['mime type','Tipo de arquivo não aceito. Envie foto (JPG/PNG) ou PDF.']
  ];
  for(const [k, v] of mapa) if(m.includes(k)) return v;
  return m;
}
/* ---------- registro de erros (vai para o painel FIEL) ---------- */
const _errosVistos = new Set(); let _errosN = 0;
function registrarErro(msg, pilha){
  try {
    msg = String(msg || 'erro').slice(0, 500); const k = msg + '|' + (S.view || '');
    if(_errosVistos.has(k) || _errosN >= 20 || !sb) return; _errosVistos.add(k); _errosN++;
    sb.from('erros_cliente').insert({ escola_id: S.perfil ? S.perfil.escola_id : (S.escola ? S.escola.id : null), versao: VERSAO, tela: String(S.view || 'inicio').slice(0, 60), mensagem: msg, pilha: pilha ? String(pilha).slice(0, 2000) : null, navegador: navigator.userAgent.slice(0, 250) }).then(() => {}, () => {});
  } catch(_){}
}
window.addEventListener('error', e => registrarErro(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; if(r._mostrado) return; registrarErro(r.message || String(r), r.stack); });
async function q(promise){ const { data, error } = await promise; if(error){ toast(traduzErro(error), 'erro'); try { error._mostrado = true; } catch(_){} throw error; } return data; }
async function buscarTodos(montar){ let out = [], i = 0; for(;;){ const d = await q(montar().range(i, i+999)); out = out.concat(d); if(d.length < 1000) break; i += 1000; } return out; }

/* ================= ESTADO ================= */
const SLUG = new URLSearchParams(location.search).get('escola') || CONFIG.ESCOLA;
let sb = null;
const S = { sessao:null, perfil:null, escola:null, cursos:[], empresas:{}, minhaPessoa:null, view:'', param:null, hist:[], msgs:{}, recovery:false, pessoa:null, busca:'' };
const staff = () => !!S.perfil && ['staff','admin'].includes(S.perfil.tipo);
const linkPortal = () => location.origin + location.pathname + (SLUG !== CONFIG.ESCOLA ? '?escola=' + encodeURIComponent(SLUG) : '');

const SOL = { rascunho:['Rascunho',''], enviada:['Aguardando análise','warn'], pendente:['Pendência — corrigir','bad'], aprovada:['Aprovada','ok'], matriculada:['Matriculado','nv'], concluida:['Concluída','ok'], reprovado:['Reprovado','bad'], recusada:['Recusada','bad'], cancelada:['Cancelada',''] };
const DOCST = { falta:['Não enviado',''], enviado:['Em análise','warn'], aprovado:['Aprovado','ok'], recusado:['Recusado','bad'], vencido:['Vencido','bad'] };
const bdg = (par) => '<span class="bdg '+par[1]+'">'+esc(par[0])+'</span>';
function bdgValidade(iso){ const d = dias(iso); if(d === null) return '<span class="bdg">—</span>'; if(d < 0) return '<span class="bdg bad">Vencido em '+fmt(iso)+'</span>'; if(d <= 30) return '<span class="bdg bad">Vence em '+d+' dia(s)</span>'; if(d <= 90) return '<span class="bdg warn">Vence em '+fmt(iso)+'</span>'; return '<span class="bdg ok">Válido até '+fmt(iso)+'</span>'; }
const parseDocs = c => (c && c.docs_exigidos || []).map(t => ({ nome: t.replace(/^\?/, '').trim(), opcional: t.startsWith('?') }));
const curso = id => S.cursos.find(c => c.id === id) || {};
function todosTiposDoc(){ const set = new Set(); S.cursos.forEach(c => parseDocs(c).forEach(d => set.add(d.nome))); set.add('Certificado de curso anterior'); set.add('Outro documento'); return [...set]; }

/* ================= MODAL ================= */
function abrirModal(titulo, corpo, botoes){
  $('#modal').innerHTML = '<div class="mbox"><h3>'+esc(titulo)+'</h3>'+corpo+'<div class="mact">'+(botoes || '')+'<button class="btn sec" onclick="fecharModal()">Fechar</button></div></div>';
  $('#modal').classList.add('on');
}
function fecharModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') fecharModal(); });
function travar(btn, txt){ if(!btn) return () => {}; const o = btn.textContent; btn.disabled = true; btn.textContent = txt || 'Aguarde...'; return () => { btn.disabled = false; btn.textContent = o; }; }

/* ================= MARCA E APLICATIVO ================= */
function corValida(c){ return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : null; }
function aplicarMarca(){
  const e = S.escola || {}, r = document.documentElement.style;
  const p = corValida(e.cor_primaria), d = corValida(e.cor_destaque);
  if(p){ r.setProperty('--navy', p); r.setProperty('--navy2', misturar(p, '#ffffff', .14)); } else { r.removeProperty('--navy'); r.removeProperty('--navy2'); }
  if(d) r.setProperty('--or', d); else r.removeProperty('--or');
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = p || '#14213d';
}
function misturar(a, b, t){ const h = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16)); const A = h(a), B = h(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const logoHtml = () => S.escola && S.escola.logo_url ? '<img class="logo" src="'+esc(S.escola.logo_url)+'" alt="'+esc(S.escola.nome)+'">' : '';
let _instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _instalar = e; document.querySelectorAll('#btnInstalar').forEach(b => b.style.display = 'inline-block'); });
async function instalarApp(){ if(!_instalar) return toast('Use o menu do navegador e escolha "Adicionar à tela inicial".'); _instalar.prompt(); await _instalar.userChoice; _instalar = null; document.querySelectorAll('#btnInstalar').forEach(b => b.style.display = 'none'); }
if('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ================= INÍCIO ================= */
async function iniciar(){
  if(!window.supabase || CONFIG.SUPABASE_URL.startsWith('COLE')){
    $('#app').innerHTML = '<div class="auth"><div class="auth-box"><div class="brand">FIEL <b style="color:var(--or)">Segurança Privada</b></div><p>Sistema ainda não configurado.</p><p class="muted small">Preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do arquivo index.html.</p></div></div>';
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data: escola } = await sb.from('escolas').select('*').eq('slug', SLUG).maybeSingle();
  S.escola = escola;
  aplicarMarca();
  sb.auth.onAuthStateChange((ev, sessao) => {
    if(ev === 'PASSWORD_RECOVERY'){ S.recovery = true; telaAuth('nova'); return; }
    if(ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED'){ S.sessao = sessao; return; }
    setTimeout(() => entrar(sessao), 0);
  });
}

async function entrar(sessao){
  if(S.recovery) return telaAuth('nova');
  if(!sessao){ S.sessao = null; S.perfil = null; return telaAuth('entrar'); }
  if(S.perfil && S.sessao && S.sessao.user.id === sessao.user.id){ S.sessao = sessao; return; }
  S.sessao = sessao;
  try {
    const perfil = await q(sb.from('perfis').select('*').eq('id', sessao.user.id).maybeSingle());
    if(!perfil){ $('#app').innerHTML = '<div class="auth"><div class="auth-box"><p>Seu cadastro não foi encontrado. Fale com a escola.</p><button class="btn" onclick="sair()">Sair</button></div></div>'; return; }
    S.perfil = perfil;
    if(!S.escola || S.escola.id !== perfil.escola_id) S.escola = await q(sb.from('escolas').select('*').eq('id', perfil.escola_id).single());
    aplicarMarca();
    const rd = await sb.rpc('sou_dono'); S.dono = !rd.error && rd.data === true;
    if(S.escola && S.escola.ativa === false && !S.dono){ $('#app').innerHTML = '<div class="auth"><div class="auth-box">'+logoHtml()+'<div class="brand">FIEL <b>Segurança Privada</b></div><div class="aviso bad" style="margin-top:16px">O acesso ao portal de <b>'+esc(S.escola.nome)+'</b> está temporariamente suspenso. Fale diretamente com a escola.</div><button class="btn sec" onclick="sair()">Sair</button></div></div>'; return; }
    await carregarCursos();
    if(staff()) await carregarEmpresas();
    if(staff()) await carregarInstrutores();
    if(perfil.tipo === 'aluno'){ const p = await q(sb.from('pessoas').select('id').eq('usuario_id', perfil.id).limit(1)); S.minhaPessoa = p[0] ? p[0].id : null; }
    S.hist = [];
    if(staff()) go('painel', null, false);
    else if(perfil.tipo === 'empresa') go('vigilantes', null, false);
    else if(perfil.tipo === 'instrutor') go('aulas', null, false);
    else go('pessoa', S.minhaPessoa, false);
  } catch(e){ console.error(e); }
}

/* ================= ARQUIVOS ================= */
async function prepararArquivo(file){
  if(file.type === 'application/pdf'){ if(file.size > 10*1024*1024) throw new Error('PDF maior que 10 MB.'); return { blob: file, ext: 'pdf', tipo: 'application/pdf' }; }
  if(!file.type.startsWith('image/')) throw new Error('Envie uma foto (JPG/PNG) ou um PDF.');
  const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('Não foi possível ler a imagem. Tente JPG ou PDF.')); i.src = URL.createObjectURL(file); });
  const max = 1800, f = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
  return { blob, ext: 'jpg', tipo: 'image/jpeg', w: c.width, h: c.height };
}
/* PDF A4 com uma foto por página, centralizada — formato aceito pelo GESP */
function pdfDeJpegs(fotos){
  const te = new TextEncoder(), partes = [], offs = []; let tam = 0;
  const add = d => { const b = typeof d === 'string' ? te.encode(d) : d; partes.push(b); tam += b.length; };
  const obj = (n, corpo) => { offs[n] = tam; add(n + ' 0 obj\n'); corpo(); add('\nendobj\n'); };
  const N = fotos.length, kids = fotos.map((_, i) => (3 + i*3) + ' 0 R').join(' ');
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add('<< /Type /Pages /Kids [' + kids + '] /Count ' + N + ' >>'));
  fotos.forEach(({ jpg, w, h }, i) => {
    const pg = 3 + i*3, im = pg + 1, ct = pg + 2;
    const deitado = w > h, pw = deitado ? 841.89 : 595.28, ph = deitado ? 595.28 : 841.89, m = 20;
    const k = Math.min((pw - 2*m) / w, (ph - 2*m) / h), dw = +(w*k).toFixed(2), dh = +(h*k).toFixed(2), x = +((pw - dw) / 2).toFixed(2), y = +((ph - dh) / 2).toFixed(2);
    const cont = 'q ' + dw + ' 0 0 ' + dh + ' ' + x + ' ' + y + ' cm /Im0 Do Q';
    obj(pg, () => add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>'));
    obj(im, () => { add('<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n'); add(jpg); add('\nendstream'); });
    obj(ct, () => add('<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream'));
  });
  const total = 3 + N*3, xref = tam;
  let tab = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for(let n = 1; n < total; n++) tab += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  add(tab + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(partes, { type: 'application/pdf' });
}
async function subirArquivo(pessoa, file){
  const arq = await prepararArquivo(file);
  const path = pessoa.escola_id + '/' + pessoa.id + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + arq.ext;
  await q(sb.storage.from('documentos').upload(path, arq.blob, { contentType: arq.tipo, upsert: false }));
  return path;
}
/* PDF de um documento: usa o já gerado, o próprio arquivo (se for PDF) ou gera agora a partir da foto */
async function pdfDoDocumento(d){
  const baixar = async path => { const { data, error } = await sb.storage.from('documentos').download(path); if(error) throw error; return data; };
  if(d.pdf_path) return baixar(d.pdf_path);
  if(/\.pdf$/i.test(d.arquivo_path)) return baixar(d.arquivo_path);
  const fotos = [];
  for(const path of (d.paginas && d.paginas.length ? d.paginas : [d.arquivo_path])){
    const foto = await baixar(path);
    const arq = await prepararArquivo(new File([foto], 'foto.jpg', { type: foto.type && foto.type.startsWith('image/') ? foto.type : 'image/jpeg' }));
    fotos.push({ jpg: new Uint8Array(await arq.blob.arrayBuffer()), w: arq.w, h: arq.h });
  }
  return pdfDeJpegs(fotos);
}
const nomeArq = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 60) || 'documento';
async function baixarPdfDoc(id, btn){
  const d = S.pessoa.docs.find(x => x.id === id); if(!d) return;
  const solta = travar(btn, 'Gerando...');
  try { const b = await pdfDoDocumento(d); baixarArquivo(nomeArq(S.pessoa.p.nome) + '_' + nomeArq(d.tipo) + '.pdf', b, 'application/pdf'); }
  catch(e){ if(!e._mostrado) toast(traduzErro(e), 'erro'); } finally { solta(); }
}
/* ZIP simples (sem compressão) — junta vários PDFs num arquivo só */
const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function montarZip(arquivos){
  const te = new TextEncoder(), partes = [], central = []; let off = 0;
  const dt = new Date(), hora = (dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1), dia = ((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate();
  for(const a of arquivos){
    const nome = te.encode(a.nome), dados = new Uint8Array(await a.blob.arrayBuffer()), crc = crc32(dados);
    const lh = new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,hora,2],[12,dia,2],[14,crc,4],[18,dados.length,4],[22,dados.length,4],[26,nome.length,2],[28,0,2]].forEach(([p, v, n]) => n === 4 ? lh.setUint32(p, v, true) : lh.setUint16(p, v, true));
    const ch = new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,hora,2],[14,dia,2],[16,crc,4],[20,dados.length,4],[24,dados.length,4],[28,nome.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([p, v, n]) => n === 4 ? ch.setUint32(p, v, true) : ch.setUint16(p, v, true));
    partes.push(new Uint8Array(lh.buffer), nome, dados); central.push(new Uint8Array(ch.buffer), nome);
    off += 30 + nome.length + dados.length;
  }
  const tamC = central.reduce((s, b) => s + b.length, 0), fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true); fim.setUint32(12, tamC, true); fim.setUint32(16, off, true);
  return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), { type: 'application/zip' });
}
/* documentos válidos de cada pessoa (o mais recente de cada tipo, sem os recusados) */
function docsParaGesp(docs){ const vistos = new Set(); return docs.filter(d => d.status !== 'recusado' && !vistos.has(d.tipo) && vistos.add(d.tipo)); }
async function zipPdfs(itens, nomeZip, btn){
  if(!itens.length) return toast('Nenhum documento para baixar.', 'erro');
  const solta = travar(btn, 'Gerando 0/' + itens.length + '...'), arquivos = [], falhas = [];
  try {
    for(let i = 0; i < itens.length; i++){
      if(btn) btn.textContent = 'Gerando ' + (i + 1) + '/' + itens.length + '...';
      try { arquivos.push({ nome: itens[i].nome, blob: await pdfDoDocumento(itens[i].d) }); } catch(e){ falhas.push(itens[i].nome); }
    }
    if(!arquivos.length) return toast('Não foi possível gerar os PDFs.', 'erro');
    baixarArquivo(nomeZip, await montarZip(arquivos), 'application/zip');
    toast(arquivos.length + ' PDF(s) baixado(s)' + (falhas.length ? '. Falharam: ' + falhas.join(', ') : '.'), falhas.length ? 'erro' : '');
  } finally { solta(); }
}
function pdfsPessoa(btn){
  const p = S.pessoa.p, pasta = nomeArq(p.nome) + (p.cpf ? '_' + soDig(p.cpf) : '');
  zipPdfs(docsParaGesp(S.pessoa.docs).map(d => ({ d, nome: pasta + '/' + nomeArq(d.tipo) + '.pdf' })), pasta + '_PDFs_GESP.zip', btn);
}
async function pdfsTurma(btn){
  const { t, mats } = S.turma, ids = mats.map(m => m.pessoa_id);
  if(!ids.length) return toast('A turma não tem alunos.', 'erro');
  const docs = await q(sb.from('documentos').select('*').in('pessoa_id', ids).order('enviado_em', { ascending: false }));

  zipPdfs(itens, 'Turma_' + nomeArq(t.codigo) + '_PDFs_GESP.zip', btn);
}
async function verArquivo(path, docId){
  const { data, error } = await sb.storage.from('documentos').createSignedUrl(path, 600);
  if(error) return toast(traduzErro(error), 'erro');
  const url = data.signedUrl, pdf = /\.pdf$/i.test(path);
  const d = docId && S.pessoa ? S.pessoa.docs.find(x => x.id === docId) : null;
  let extras = [];
  if(d && d.paginas && d.paginas.length > 1){ const r = await sb.storage.from('documentos').createSignedUrls(d.paginas.slice(1), 600); extras = (r.data || []).map(x => x.signedUrl).filter(Boolean); }
  let corpo = '<div class="visor">' + (pdf ? '<iframe src="'+esc(url)+'" title="Documento"></iframe>' : '<img src="'+esc(url)+'" alt="Documento enviado">' + extras.map((u, i) => '<div class="small muted" style="margin:8px 0 4px">Página '+(i + 2)+'</div><img src="'+esc(u)+'" alt="Página '+(i + 2)+'">').join('')) + '</div>';
  if(d) corpo += '<div class="small muted" style="margin-top:8px">'+(S.pessoa.p ? esc(S.pessoa.p.nome)+' · ' : '')+'Enviado em '+fmt(d.enviado_em)+(d.validade ? ' · validade '+fmt(d.validade) : '')+' · '+DOCST[estadoDoc(d)][0]+'</div>';
  let botoes = '<a class="btn sec" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir em nova aba</a>' + (d && staff() ? '<button class="btn nv" onclick="baixarPdfDoc(\''+d.id+'\',this)">⬇ PDF (GESP)</button>' : '');
  if(d && staff()){
    const outros = S.pessoa.docs.filter(x => x.status === 'enviado' && x.id !== d.id).length;
    botoes = (d.status !== 'recusado' ? '<button class="btn dg" onclick="recusarDoc(\''+d.id+'\')">Recusar</button>' : '') +
      (d.status !== 'aprovado' ? '<button class="btn ok" onclick="aprovarNoVisor(\''+d.id+'\',this)">'+(outros ? 'Aprovar e próximo ('+outros+')' : 'Aprovar')+'</button>' : '') + botoes;
  }
  abrirModal(d ? d.tipo : 'Documento', corpo, botoes);
  $('.mbox').classList.add('grande');
}
async function aprovarNoVisor(id, btn){
  if(!confirmaValidade([id])) return;
  const solta = travar(btn);
  try {
    await q(sb.from('documentos').update({ status: 'aprovado', motivo: null }).eq('id', id));
    const d = S.pessoa.docs.find(x => x.id === id); if(d){ d.status = 'aprovado'; d.motivo = null; }
    S._recarregarAoFechar = true;
    const prox = S.pessoa.docs.find(x => x.status === 'enviado');
    if(prox){ toast('Aprovado. Próximo documento.'); verArquivo(prox.arquivo_path, prox.id); }
    else { toast('Todos os documentos foram analisados.'); fecharModal(); }
  } finally { solta(); }
}
async function aprovarTodos(){
  const ids = S.pessoa.docs.filter(d => d.status === 'enviado').map(d => d.id);
  if(!ids.length || !confirm('Aprovar '+ids.length+' documento(s) em análise? Confirme que você já conferiu todos.') || !confirmaValidade(ids)) return;
  await q(sb.from('documentos').update({ status: 'aprovado', motivo: null }).in('id', ids));
  toast('Documentos aprovados.'); recarregar();
}

/* ---------- MEUS CURSOS (portal do aluno) ---------- */
function cardMeusCursos(sols, certs){
  const hoje = hojeISO(), pre = sols.filter(s => ['rascunho','enviada','pendente','aprovada'].includes(s.status)), and = sols.filter(s => s.status === 'matriculada');
  const venceDe = c => { const vm = c.cursos ? c.cursos.validade_meses : 0; return vm > 0 ? addMeses(c.data_conclusao, vm) : null; };
  const ultimo = {}; certs.forEach(c => { const k = (c.cursos && c.cursos.grupo_validade) || c.curso_id; if(!ultimo[k] || c.data_conclusao > ultimo[k].data_conclusao) ultimo[k] = c; });
  const venc = Object.values(ultimo).filter(c => venceDe(c) && venceDe(c) < hoje), conc = certs.filter(c => !venc.includes(c));
  const ir = id => 'onclick="document.getElementById(\''+id+'\').scrollIntoView({behavior:\'smooth\'})"';
  let h = '<div class="card"><h3>Meus cursos</h3><div class="kpis">'+
    '<div class="kpi" '+ir('mcPre')+'><span>Em pré-matrícula</span><b style="color:var(--warn)">'+pre.length+'</b></div>'+
    '<div class="kpi" '+ir('mcAnd')+'><span>Matriculado / em andamento</span><b style="color:var(--navy2)">'+and.length+'</b></div>'+
    '<div class="kpi" '+ir('mcConc')+'><span>Concluídos</span><b style="color:var(--ok)">'+conc.length+'</b></div>'+
    '<div class="kpi" '+ir('mcVenc')+'><span>Vencidos</span><b style="color:var(--bad)">'+venc.length+'</b></div></div>';
  // em andamento
  h += '<div class="secao" id="mcAnd">Em andamento</div>';
  h += and.length ? and.map(s => blocoAndamento(s)).join('') : '<p class="muted small">Nenhum curso em andamento.</p>';
  // pré-matrícula
  h += '<div class="secao" id="mcPre">Em pré-matrícula</div>';
  h += pre.length ? '<div class="tw"><table>'+pre.map(s => '<tr><td><b>'+esc(s.cursos ? s.cursos.sigla : '')+'</b> <span class="muted small">'+esc(s.cursos ? s.cursos.nome : '')+'</span></td><td>'+bdg(SOL[s.status])+'</td><td class="small">'+(s._fila ? s._fila+'º da fila para a próxima turma' : s.status === 'pendente' ? 'Corrija o que a escola pediu abaixo' : s.status === 'rascunho' ? 'Envie os documentos e mande para análise' : 'Aguardando a escola')+'</td></tr>').join('')+'</table></div>' : '<p class="muted small">Nenhuma pré-matrícula aberta.</p>';
  // concluídos
  h += '<div class="secao" id="mcConc">Concluídos</div>';
  h += conc.length ? '<div class="tw"><table>'+conc.map(c => { const v = venceDe(c), k = (c.cursos && c.cursos.grupo_validade) || c.curso_id, renovado = ultimo[k] !== c;
      return '<tr><td><b>'+esc(c.cursos ? c.cursos.sigla : '')+'</b> <span class="muted small">'+esc(c.cursos ? c.cursos.nome : '')+'</span></td><td class="small">Concluído em '+fmt(c.data_conclusao)+'</td><td>'+(renovado ? '<span class="bdg">Substituído por curso mais recente</span>' : v ? bdgValidade(v) : '<span class="bdg ok">Sem validade</span>')+'</td></tr>'; }).join('')+'</table></div>' : '<p class="muted small">Nenhum curso concluído registrado.</p>';
  // vencidos
  h += '<div class="secao" id="mcVenc">Vencidos</div>';
  h += venc.length ? '<div class="tw"><table>'+venc.map(c => '<tr><td><b>'+esc(c.cursos ? c.cursos.sigla : '')+'</b> <span class="muted small">'+esc(c.cursos ? c.cursos.nome : '')+'</span></td><td><span class="bdg bad">Venceu em '+fmt(venceDe(c))+'</span></td><td><button class="btn sm" onclick="novaSolicitacao()">Fazer a atualização</button></td></tr>').join('')+'</table></div>' : '<p class="muted small">Nenhum curso vencido.</p>';
  return h + '</div>';
}
function blocoAndamento(s){
  const a = s._and, c = s.cursos || {};
  if(!a) return '<div class="sol"><h4>'+esc(c.sigla || '')+' — '+esc(c.nome || '')+'</h4><p class="muted small">Andamento indisponível.</p></div>';
  const ds = a.disciplinas || [], aulas = a.aulas || [], hoje = hojeISO();
  const carga = ds.reduce((t, d) => t + Number(d.carga || 0), 0) || aulas.reduce((t, x) => t + Number(x.horas || 0), 0);
  const dadas = ds.length ? ds.reduce((t, d) => t + Math.min(Number(d.dadas || 0), Number(d.carga || 0) || Infinity), 0) : aulas.filter(x => x.feita).reduce((t, x) => t + Number(x.horas_dadas ?? x.horas), 0);
  const pc = carga ? Math.min(100, Math.round(dadas * 100 / carga)) : 0;
  const feitas = aulas.filter(x => x.feita), hDadas = feitas.reduce((t, x) => t + Number(x.horas_dadas ?? x.horas), 0), hPres = feitas.filter(x => x.presente).reduce((t, x) => t + Number(x.horas_dadas ?? x.horas), 0);
  const freq = hDadas ? Math.round(hPres * 1000 / hDadas) / 10 : null, faltas = feitas.filter(x => x.presente === false).length;
  const prox = aulas.filter(x => x.data >= hoje && !x.feita).slice(0, 5);
  let h = '<div class="sol"><h4>'+esc(c.sigla || '')+' — '+esc(c.nome || '')+' · Turma '+esc(a.turma.codigo)+'</h4>'+
    '<div class="small muted">'+fmt(a.turma.inicio)+' a '+fmt(a.turma.fim)+(a.turma.turno ? ' · '+esc(a.turma.turno) : '')+(a.turma.local ? ' · '+esc(a.turma.local) : '')+'</div>'+

function escolherArq(inp){
  const novos = [...(inp.files || [])]; inp.value = '';
  if(!novos.length) return;
  if(novos.some(f => f.type === 'application/pdf')){
    if(novos.length > 1 || S.arqsEnvio.length) toast('PDF vai sozinho. Para juntar páginas, use fotos.', 'erro');
    S.arqsEnvio = [novos.find(f => f.type === 'application/pdf')];
  } else {
    S.arqsEnvio = S.arqsEnvio.filter(f => f.type !== 'application/pdf').concat(novos).slice(0, 10);
  }
  mostrarArqs();
}
function mostrarArqs(){
  const n = $('#enNome'); if(!n) return;
  const l = S.arqsEnvio;
  n.innerHTML = !l.length ? '' : (l[0].type === 'application/pdf' ? 'PDF selecionado: ' + esc(l[0].name) : '<b>' + l.length + ' página(s)</b> — vão virar um único PDF. ' + (l.length < 10 ? 'Tem verso ou mais páginas? Tire outra foto.' : '')) +
    ' <a href="#" onclick="S.arqsEnvio=[];mostrarArqs();return false">Limpar</a>';

async function cancelarSolicitacao(id){

function confirmaValidade(ids){
  const hoje = hojeISO(), l = ids.map(id => S.pessoa.docs.find(x => x.id === id)).filter(d => d && d.validade);
  const venc = l.filter(d => d.validade < hoje), logo = l.filter(d => d.validade >= hoje && d.validade <= addDias(hoje, 30));
  if(venc.length && !confirm('ATENÇÃO: documento VENCIDO\n\n' + venc.map(d => '• ' + d.tipo + ' — venceu em ' + fmt(d.validade)).join('\n') + '\n\nO correto é recusar e pedir um atualizado. Aprovar mesmo assim?')) return false;
  if(logo.length && !confirm('Documento vencendo em até 30 dias:\n\n' + logo.map(d => '• ' + d.tipo + ' — vence em ' + fmt(d.validade)).join('\n') + '\n\nConfira se continua válido até o envio ao GESP/fim do curso. Aprovar?')) return false;
  return true;
}
async function analisarDoc(id, status, motivo){

  await q(sb.from('documentos').update({ status, motivo: motivo || null }).eq('id', id));
  toast(status === 'aprovado' ? 'Documento aprovado.' : 'Documento recusado.'); recarregar();

async function salvarSituacao(id, btn){
  const status = $('#st_' + id).value, obs_escola = $('#ob_' + id).value.trim() || null;
  const s = S.pessoa.sols.find(x => x.id === id);
  const solta = travar(btn);
  try {
    await q(sb.from('solicitacoes').update({ status, obs_escola }).eq('id', id));
    if(status === 'concluida' && s.status !== 'concluida'){
      solta(); toast('Situação salva. Registre agora a data de conclusão.');
      novaCertificacao(true, s.curso_id); return;
    }
    const p = S.pessoa.p, nomeCurso = (s.cursos && s.cursos.sigla) || '';
    if(status !== s.status && ['pendente','aprovada','recusada','matriculada'].includes(status)){
      const txt = { pendente: 'tem pendências que precisam ser corrigidas', aprovada: 'foi APROVADA', recusada: 'não pôde ser aprovada', matriculada: 'foi confirmada: você está matriculado(a)' }[status];
      const msg = 'Olá, ' + p.nome.split(' ')[0] + '! Sua pré-matrícula no curso ' + nomeCurso + ' ' + txt + '.' + (obs_escola ? '\n' + obs_escola : '') + '\nAcompanhe pelo portal.' + assinatura();
      abrirModal('Situação atualizada', '<p>Deseja avisar o aluno agora?</p><div class="bar">'+botoesContato(p, 'Pré-matrícula ' + nomeCurso, msg)+'</div>', '');
      S._recarregarAoFechar = true;
    } else { toast('Situação salva.'); recarregar(); }
  } finally { solta(); }
}

/* ================= TELA: VIGILANTES (empresa) ================= */
async function vVigilantes(empresaId){
  const eid = empresaId || (S.perfil.tipo === 'empresa' ? S.perfil.id : null);
  const lista = await buscarTodos(() => sb.from('pessoas').select('id,nome,cpf,telefone').eq('empresa_id', eid).order('nome'));
  const ids = lista.map(p => p.id);
  let sols = [], vals = [];
  if(ids.length){
    for(let i = 0; i < ids.length; i += 150){
      const fatia = ids.slice(i, i+150);
      sols = sols.concat(await q(sb.from('solicitacoes').select('pessoa_id,status,criado_em,cursos(sigla)').in('pessoa_id', fatia).order('criado_em', { ascending: false })));
      vals = vals.concat(await q(sb.from('v_validades').select('pessoa_id,sigla,vence_em').in('pessoa_id', fatia)));
    }
  }
  const nomeEmp = empresaId && S.empresas[empresaId] ? S.empresas[empresaId].nome : '';
  let h = '<div class="bar">'+btnVoltar()+'<h2 style="margin:0">Vigilantes'+(nomeEmp ? ' — '+esc(nomeEmp) : '')+' <span class="muted">('+lista.length+')</span></h2><span class="sp"></span>'+
    '<button class="btn nv" onclick="modalLote()">Pré-matrícula em lote</button><button class="btn sec" onclick="modalImportar(\''+eid+'\')">Importar lista</button><button class="btn" onclick="modalNovaPessoa(\''+eid+'\')">+ Vigilante</button></div>';
  if(!lista.length) return h + '<div class="card"><p>Nenhum vigilante cadastrado.</p><p class="muted small">Cadastre um a um ou importe uma lista. Depois, abra cada vigilante para criar a pré-matrícula e enviar os documentos.</p></div>';
  h += '<div class="card"><p class="small muted" style="margin-top:0">Marque os vigilantes e use <b>Pré-matrícula em lote</b> para pedir o mesmo curso (ex.: atualização) para todos de uma vez.</p><div class="tw"><table><tr><th><input type="checkbox" onclick="document.querySelectorAll(\'.selVig\').forEach(c=>c.checked=this.checked)"></th><th>Nome</th><th>CPF</th><th>Última pré-matrícula</th><th>Próximo vencimento</th></tr>'+lista.map(p => {

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function graficoVencimentos(meses){
  const estreito = window.innerWidth < 600, W = estreito ? 360 : 720, H = estreito ? 200 : 230, mL = 4, mR = 4, mT = 24, mB = 28, n = meses.length;
  const max = Math.max(1, ...meses.map(m => m.n)), passo = (W - mL - mR) / n, larg = Math.min(40, passo - 6);
  const esc_ = v => (H - mB - mT) * v / max;
  let g = '<line x1="'+mL+'" x2="'+(W - mR)+'" y1="'+(H - mB)+'" y2="'+(H - mB)+'" stroke="#dfe3ec"/>';
  const iMax = meses.findIndex(m => m.n === max && m.n > 0);
  meses.forEach((m, i) => {
    const x = mL + i * passo + (passo - larg) / 2, h = esc_(m.n), y = H - mB - h, [a, mm] = m.mes.split('-');
    const rotulo = MESES[Number(mm) - 1] + (mm === '01' || i === 0 ? '/' + a.slice(2) : '');
    if(m.n > 0) g += '<path class="barra" d="M'+x+','+(H - mB)+' V'+(y + 4)+' Q'+x+','+y+' '+(x + 4)+','+y+' H'+(x + larg - 4)+' Q'+(x + larg)+','+y+' '+(x + larg)+','+(y + 4)+' V'+(H - mB)+' Z"><title>'+rotulo+': '+m.n+' vencimento(s)</title></path>';
    else g += '<rect x="'+x+'" y="'+(H - mB - 2)+'" width="'+larg+'" height="2" fill="#dfe3ec"><title>'+rotulo+': nenhum vencimento</title></rect>';
    if(m.n > 0 && (i === iMax || !estreito)) g += '<text class="rot" x="'+(x + larg / 2)+'" y="'+(y - 6)+'" text-anchor="middle">'+m.n+'</text>';
    if(!estreito || i % 2 === 0) g += '<text x="'+(x + larg / 2)+'" y="'+(H - 10)+'" text-anchor="middle">'+rotulo+'</text>';
  });
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Vencimentos de curso por mês nos próximos 12 meses">'+g+'</svg>';
}

function topoBom(v){ if(v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); for(const m of [2, 4, 6, 8, 10]) if(m * p >= v) return m * p; return v; }
function iniciarDica(){
  if(window.__ttOk) return; window.__ttOk = true;
  const tt = document.createElement('div'); tt.id = 'tt'; document.body.appendChild(tt);
  const mover = ev => { const x = Math.min(ev.clientX + 14, innerWidth - tt.offsetWidth - 8); tt.style.left = Math.max(8, x) + 'px'; tt.style.top = (ev.clientY + 16) + 'px'; };
  document.addEventListener('mouseover', ev => { const el = ev.target.closest && ev.target.closest('[data-tt]'); if(!el){ tt.style.display = 'none'; return; } tt.innerHTML = el.getAttribute('data-tt'); tt.style.display = 'block'; mover(ev); });
  document.addEventListener('mousemove', ev => { if(tt.style.display === 'block') mover(ev); });
  document.addEventListener('scroll', () => { tt.style.display = 'none'; }, true);
}
const dica = html => ' data-tt="' + String(html).replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"';
function graficoLinhas(meses, series, rotulo, largo){
  const estreito = window.innerWidth < 600, W = estreito ? 360 : largo ? 900 : 560, H = estreito ? 220 : largo ? 250 : 230, mL = 30, mR = 12, mT = 14, mB = 26, n = meses.length;
  const vals = series.flatMap(s => meses.map(m => m[s.k]).filter(v => v !== null && v !== undefined));
  const max = topoBom(Math.max(1, ...vals)), passo = (W - mL - mR) / Math.max(1, n - 1);
  const X = i => mL + i * passo, Y = v => H - mB - (H - mB - mT) * v / max;
  let g = '';
  [0, max / 2, max].forEach(t => { g += '<line x1="'+mL+'" x2="'+(W - mR)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="'+(t ? '#eef1f6' : '#dfe3ec')+'"/><text x="'+(mL - 6)+'" y="'+(Y(t) + 4)+'" text-anchor="end">'+fmtN(t)+'</text>'; });
  meses.forEach((m, i) => { if(!estreito || (n - 1 - i) % 2 === 0) g += '<text x="'+X(i)+'" y="'+(H - 8)+'" text-anchor="middle">'+rotMes(m.mes, true)+'</text>'; });
  series.forEach(s => {
    let d = '', pen = false;
    meses.forEach((m, i) => { const v = m[s.k]; if(v === null || v === undefined){ pen = false; return; } d += (pen ? 'L' : 'M') + X(i) + ',' + Y(v) + ' '; pen = true; });
    g += '<path class="linha" d="'+d+'" stroke="'+s.cor+'"/>';
    meses.forEach((m, i) => { const v = m[s.k]; if(v !== null && v !== undefined && (v > 0 || series.length === 1)) g += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+s.cor+'" stroke="#fff" stroke-width="2"/>'; });
  });
  meses.forEach((m, i) => {
    const t = '<b>'+rotMes(m.mes)+'</b><br>' + series.map(s => '<span style="color:'+s.cor+'">●</span> '+s.nome+': <b>'+fmtN(m[s.k])+'</b>'+(s.un || '')).join('<br>');
    g += '<g class="col"'+dica(t)+'><line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+mT+'" y2="'+(H - mB)+'" stroke="#9aa3b5" stroke-dasharray="3 3"/><rect x="'+(X(i) - passo / 2)+'" y="0" width="'+passo+'" height="'+(H - mB)+'" fill="transparent"/></g>';
  });
  const leg = series.length > 1 ? '<div class="leg">'+series.map(s => '<span><i style="background:'+s.cor+'"></i>'+s.nome+' <b style="color:var(--tx)">'+fmtN(meses.reduce((a, m) => a + (m[s.k] || 0), 0))+'</b></span>').join('')+'</div>' : '';
  const tab = '<details class="num"><summary>Ver números</summary><div class="tw"><table><tr><th>Mês</th>'+series.map(s => '<th>'+s.nome+'</th>').join('')+'</tr>'+meses.map(m => '<tr><td>'+rotMes(m.mes)+'</td>'+series.map(s => '<td>'+fmtN(m[s.k])+'</td>').join('')+'</tr>').join('')+'</table></div></details>';
  return leg + '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(rotulo)+'">'+g+'</svg>' + tab;
}
function barrasH(itens, o){ // itens: [{nome, v, txt, tt, ref}]
  if(!itens.length) return '<p class="muted small">Sem dados ainda.</p>';
  const max = o.max || Math.max(1, ...itens.map(i => i.v || 0));
  return '<div class="hb">'+itens.map(i => '<div><div class="ln"><span title="'+esc(i.nome)+'">'+esc(i.nome)+'</span><span>'+i.txt+'</span></div><div class="tr"'+dica(i.tt || (esc(i.nome)+': <b>'+fmtN(i.v)+'</b>'))+'>'+(i.v ? '<i style="width:'+Math.min(100, 100 * i.v / max)+'%"></i>' : '')+(i.ref ? '<span class="ref" style="left:'+Math.min(100, 100 * i.ref / max)+'%"></span>' : '')+'</div></div>').join('')+'</div>';
}
function pilha(partes){ // [{nome, v, cor}]
  const tot = partes.reduce((a, p) => a + p.v, 0);
  if(!tot) return '<p class="muted small">Sem dados ainda.</p>';
  const pc = v => Math.round(100 * v / tot) + '%';
  return '<div class="pilha">'+partes.filter(p => p.v).map(p => '<i style="flex:'+p.v+';background:'+p.cor+'"'+dica(p.nome+': <b>'+fmtN(p.v)+'</b> ('+pc(p.v)+')')+'></i>').join('')+'</div>'+
    '<div class="leg">'+partes.map(p => '<span><i style="background:'+p.cor+'"></i>'+p.nome+' <b style="color:var(--tx)">'+fmtN(p.v)+'</b> · '+pc(p.v)+'</span>').join('')+'</div>';
}

async function enviarLogo(inp){
  const f = inp.files && inp.files[0]; inp.value = ''; if(!f) return;
  if(f.size > 1048576) return toast('O logo precisa ter até 1 MB.', 'erro');
  const ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z]/g, '') || 'png';
  const path = S.escola.id + '/logo-' + Date.now() + '.' + ext;
  await q(sb.storage.from('logos').upload(path, f, { contentType: f.type, upsert: false }));
  const url = sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
  const antigo = S.escola.logo_url;
  S.escola = await q(sb.from('escolas').update({ logo_url: url }).eq('id', S.escola.id).select().single());
  apagarLogoAntigo(antigo);
  toast('Logo atualizado.'); $('#app').innerHTML = ''; go('escola', null, false);
}
function apagarLogoAntigo(url){ const m = url && url.split('/object/public/logos/')[1]; if(m) sb.storage.from('logos').remove([decodeURIComponent(m)]); }

async function executarLimpeza(btn){
  const l = S.limpeza || []; if(!l.length) return;
  if(!confirm('Apagar definitivamente '+l.length+' arquivo(s)? Esta ação não pode ser desfeita.')) return;
  const solta = travar(btn, 'Apagando...');
  try {
    const paths = [...new Set(l.map(x => x.arquivo_path).concat(l.map(x => x.pdf_path), l.flatMap(x => x.paginas || [])).filter(Boolean))];
    for(let i = 0; i < paths.length; i += 100) await q(sb.storage.from('documentos').remove(paths.slice(i, i + 100)));
    const ids = l.map(x => x.id);
    for(let i = 0; i < ids.length; i += 100) await q(sb.from('documentos').delete().in('id', ids.slice(i, i + 100)));
    S.limpeza = []; fecharModal(); toast(l.length + ' arquivo(s) apagado(s).');
  } finally { solta(); }
}

/* ---------- cronograma de aulas e chamada ---------- */
function cardCronograma(t, mats, aulas, discs, fechada){
  const hProg = {}, hDada = {};
  aulas.forEach(a => { const k = a.disciplina_id || '-'; hProg[k] = (hProg[k] || 0) + Number(a.horas || 0); if(a.chamada_feita) hDada[k] = (hDada[k] || 0) + Number(a.horas_dadas ?? a.horas ?? 0); });
  const totProg = aulas.reduce((s, a) => s + Number(a.horas || 0), 0), totCarga = discs.reduce((s, d) => s + Number(d.carga_horas || 0), 0), feitas = aulas.filter(a => a.chamada_feita).length;
  let h = '<div class="card"><div class="bar"><h3 style="margin:0">Cronograma de aulas ('+aulas.length+')</h3><span class="sp"></span>'+
    (aulas.length ? '<button class="btn sec sm" onclick="imprimirCronograma()">Imprimir cronograma</button>' : '')+
    (fechada ? '' : (feitas ? '<button class="btn nv sm" onclick="aplicarFrequencia(\''+t.id+'\',this)">Calcular frequência pela chamada</button>' : '')+'<button class="btn sm" onclick="modalAula(\'\')">+ Aula</button>')+'</div>';
  if(discs.length) h += '<div class="tw"><table><tr><th>Disciplina</th><th>Instrutor</th><th>Carga</th><th>Programado</th><th>Ministrado</th><th>Situação</th></tr>'+discs.map(d => {
      const pr = hProg[d.id] || 0, dd = hDada[d.id] || 0, falta = Number(d.carga_horas) - pr, pc = Number(d.carga_horas) ? Math.min(100, Math.round(dd * 100 / Number(d.carga_horas))) : 0;
      return '<tr><td>'+esc(d.nome)+'</td><td class="small">'+esc(nomeInstrutor(d.instrutor_id) || '—')+'</td><td>'+Number(d.carga_horas)+' h</td><td>'+pr+' h '+(falta > 0 ? '<span class="bdg warn">faltam '+falta+' h</span>' : '')+'</td><td style="min-width:110px">'+dd+' h<div class="prog"><i style="width:'+pc+'%"></i></div></td>'+
        '<td>'+(d._concluida ? '<span class="bdg ok">Concluída</span>'+(fechada ? '' : ' <a href="#" class="small" onclick="reabrirDisc(\''+t.id+'\',\''+d.id+'\');return false">reabrir</a>') : dd > 0 ? '<span class="bdg warn">Em andamento</span>' : '<span class="bdg">Não iniciada</span>')+'</td></tr>';
    }).join('')+'<tr><td colspan="2"><b>Total</b></td><td><b>'+totCarga+' h</b></td><td><b>'+totProg+' h</b></td><td><b>'+Object.values(hDada).reduce((a, b) => a + b, 0)+' h</b></td><td></td></tr></table></div>';
  else h += '<p class="small muted">Cadastre as disciplinas e a carga horária do curso em <a href="#" onclick="go(\'cursos\');return false">Cursos</a> para acompanhar se a turma cumpre a carga exigida.</p>';
  h += aulas.length ? '<div class="tw" style="margin-top:10px"><table><tr><th>Data</th><th>Horário</th><th>Disciplina</th><th>Instrutor</th><th>Horas</th><th>Chamada</th><th></th></tr>'+aulas.map(a =>
      '<tr><td>'+fmt(a.data)+' <span class="muted small">'+['dom','seg','ter','qua','qui','sex','sáb'][new Date(a.data + 'T12:00').getDay()]+'</span></td><td>'+(a.inicio ? a.inicio.slice(0, 5) + (a.fim ? '–' + a.fim.slice(0, 5) : '') : '—')+'</td><td>'+esc(a.disciplinas ? a.disciplinas.nome : (a.conteudo || '—'))+'</td><td>'+esc(a.instrutor || '—')+'</td><td>'+Number(a.horas)+'</td>'+
      '<td>'+(a.chamada_feita ? '<span class="bdg ok">Dada'+(a.horas_dadas != null && Number(a.horas_dadas) < Number(a.horas) ? ' '+Number(a.horas_dadas)+'/'+Number(a.horas)+' h' : '')+'</span>' : '<span class="bdg">Pendente</span>')+'</td><td class="acoes">'+
      (mats.length && !fechada ? '<button class="btn '+(a.chamada_feita ? 'sec' : 'ok')+' sm" onclick="go(\'chamada\',\''+a.id+'\')">Chamada</button> ' : '')+
      '<button class="btn sec sm" onclick="listaPresenca(\''+a.id+'\')" title="Imprimir lista de presença desta aula">🖨</button>'+
      (fechada ? '' : ' <button class="btn sec sm" onclick="modalAula(\''+a.id+'\')">Editar</button>')+'</td></tr>').join('')+'</table></div>'
    : '<p class="muted">Nenhuma aula lançada. Use "+ Aula" para montar o cronograma.</p>';
  return h + '</div>';
}

async function salvarAula(id, btn){
  const { t } = S.turma;
  const dados = { data: $('#auData').value, horas: Number($('#auHoras').value || 0), inicio: $('#auIni').value || null, fim: $('#auFim').value || null, disciplina_id: $('#auDisc').value || null, instrutor_id: $('#auInstId').value || null, instrutor: nomeInstrutor($('#auInstId').value) || $('#auInst').value.trim() || null, conteudo: $('#auCont').value.trim() || null };
  if(!dados.data || !(dados.horas > 0)) return toast('Informe a data e as horas-aula.', 'erro');
  const solta = travar(btn);

    if(id) await q(sb.from('aulas').update(dados).eq('id', id));
    else {
      const rep = $('#auRep').value, linhas = [Object.assign({ turma_id: t.id, escola_id: t.escola_id }, dados)];
      if(rep !== '0'){
        if(!t.fim) return toast('Informe o término da turma (Editar) para repetir as aulas.', 'erro');
        for(let d = addDias(dados.data, 1); d <= t.fim && linhas.length < 200; d = addDias(d, 1)){

        }

      await q(sb.from('aulas').insert(linhas));
      if(linhas.length > 1) toast(linhas.length + ' aulas lançadas.');
    }
    fecharModal(); recarregar();
  } finally { solta(); }
}

  let h = '<div class="bar">'+btnVoltar()+'<h2 style="margin:0">Chamada — '+fmt(a.data)+'</h2><span class="sp"></span>'+(a.chamada_feita ? '<span class="bdg ok">Já registrada — você pode corrigir</span>' : '')+'</div>';
  h += '<div class="card"><div class="kpis" style="margin:0">'+
    '<div class="kpi" style="cursor:default"><span>Turma</span><b style="font-size:18px">'+esc(a.turmas.codigo)+'</b><span>'+esc(a.turmas.cursos ? a.turmas.cursos.sigla : '')+'</span></div>'+
    '<div class="kpi" style="cursor:default"><span>Disciplina</span><b style="font-size:18px">'+esc(a.disciplinas ? a.disciplinas.nome : (a.conteudo || '—'))+'</b><span>'+(carga ? 'Carga: '+carga+' h · já dadas: '+jaDadas+' h' : '')+'</span></div>'+
    '<div class="kpi" style="cursor:default"><span>Horário · Instrutor</span><b style="font-size:18px">'+(a.inicio ? a.inicio.slice(0, 5) + (a.fim ? '–' + a.fim.slice(0, 5) : '') : '—')+'</b><span>'+esc(a.instrutor || '—')+'</span></div>'+
    '<div class="kpi" style="cursor:default"><span>Presentes</span><b id="chCont">—</b></div></div></div>';
  h += '<div class="card"><div class="bar"><h3 style="margin:0">Alunos ('+alunos.length+')</h3><span class="sp"></span><span class="small muted">Toque no nome para marcar falta</span><button class="btn sec sm" onclick="chamadaTodos(true)">Todos presentes</button></div>'+
    (alunos.length ? S.chamada.alunos.map((x, i) => '<div class="cham" id="ch'+i+'" onclick="alternarPresenca('+i+')"><span>'+(i + 1)+'. '+esc(x.nome)+'</span><span class="st"></span></div>').join('') : '<p class="muted">Nenhum aluno matriculado nesta turma.</p>')+'</div>';
  h += '<div class="card"><h3>Conclusão da aula</h3><div class="fgrid">'+
    '<label class="f"><span>Horas-aula dadas hoje (previstas: '+Number(a.horas)+')</span><input id="chHoras" type="number" min="0" max="'+Number(a.horas)+'" step="0.5" value="'+hd+'" oninput="atualizarCham()"></label>'+
    '<div class="f"><span>&nbsp;</span><div class="bar" style="margin:0"><button class="btn sec sm" onclick="$(\'#chHoras\').value='+Number(a.horas)+';atualizarCham()">Aula completa ('+Number(a.horas)+' h)</button></div></div>'+
    '<label class="f w"><span>Conteúdo ministrado (opcional)</span><input id="chCont2" value="'+esc(a.conteudo)+'"></label>'+
    (a.disciplina_id ? '<label class="chk w" style="font-size:15px"><input type="checkbox" id="chConc" onchange="this.dataset.mexeu=1"'+(S.chamada.concluida ? ' checked disabled' : '')+'> <span><b>Concluir a disciplina '+esc(a.disciplinas.nome)+' nesta turma</b>'+(S.chamada.concluida ? ' (já concluída)' : '')+' <span id="chProg" class="small muted"></span></span></label>' : '')+
    '</div><button class="btn ok" style="font-size:16px;padding:12px 18px" onclick="salvarRegistroAula(this)">Salvar chamada e horas</button></div>';
  setTimeout(atualizarCham, 0);
  return h;
}
function alternarPresenca(i){ const x = S.chamada.alunos[i]; x.presente = !x.presente; atualizarCham(); }
function chamadaTodos(v){ S.chamada.alunos.forEach(x => x.presente = v); atualizarCham(); }
function atualizarCham(){
  const c = S.chamada; if(!c) return;
  c.alunos.forEach((x, i) => { const el = $('#ch' + i); if(!el) return; el.classList.toggle('falta', !x.presente); el.querySelector('.st').innerHTML = x.presente ? '<span style="color:var(--ok)">Presente</span>' : '<span style="color:var(--bad)">Falta</span>'; });
  const p = c.alunos.filter(x => x.presente).length, el = $('#chCont'); if(el) el.textContent = p + ' / ' + c.alunos.length;
  const hh = Number(($('#chHoras') || {}).value || 0), tot = c.jaDadas + hh, pr = $('#chProg');
  if(pr && c.carga){ pr.textContent = '— com esta aula: ' + tot + ' de ' + c.carga + ' h' + (tot >= c.carga ? ' (carga completa)' : ''); const cb = $('#chConc'); if(cb && !cb.disabled && !cb.dataset.mexeu && tot >= c.carga) cb.checked = true; }
}
async function salvarRegistroAula(btn){
  const c = S.chamada, horas = Number($('#chHoras').value);
  if(isNaN(horas) || horas < 0 || horas > Number(c.a.horas)) return toast('Horas dadas devem ficar entre 0 e ' + Number(c.a.horas) + '.', 'erro');
  const cb = $('#chConc'), concluir = !!(cb && cb.checked && !cb.disabled);
  if(concluir && c.carga && c.jaDadas + horas < c.carga && !confirm('A carga desta disciplina ainda não foi completada (' + (c.jaDadas + horas) + ' de ' + c.carga + ' h). Concluir mesmo assim?')) return;
  const solta = travar(btn, 'Salvando...');
  try {
    const r = await q(sb.rpc('registrar_aula', { p_aula: c.a.id, p_presencas: c.alunos.map(x => ({ solicitacao_id: x.solicitacao_id, presente: x.presente })), p_horas: horas, p_concluir_disciplina: concluir, p_conteudo: $('#chCont2').value }));
    toast('Chamada salva: ' + r.presentes + ' presente(s), ' + r.faltas + ' falta(s), ' + horas + ' h dadas' + (concluir ? '. Disciplina concluída.' : '.'));
    S.hist.length ? voltar() : go('aulas', null, false);
  } finally { solta(); }
}

async function marcarGesp(id, campo, marcado){ await q(sb.from('turmas').update({ [campo]: marcado ? hojeISO() : null }).eq('id', id)); recarregar(); }
async function salvarMat(id, campo, valor){
  let v = valor === '' ? null : valor;
  if(v !== null && campo !== 'resultado'){ v = Number(String(v).replace(',', '.')); const max = campo === 'frequencia' ? 100 : 10; if(isNaN(v) || v < 0 || v > max) return toast('Valor inválido (0 a '+max+').', 'erro'); }
  await q(sb.from('solicitacoes').update({ [campo]: v }).eq('id', id));
  const m = S.turma.mats.find(x => x.id === id); if(m) m[campo] = v;
  if(campo === 'resultado') recarregar(); else toast('Salvo.');
}
async function matricularSel(turmaId, btn){
  const ids = [...document.querySelectorAll('.selMat:checked')].map(c => c.value);
  if(!ids.length) return toast('Selecione pelo menos um aluno.', 'erro');
  const t = S.turma.t;
  if(t.vagas && S.turma.mats.length + ids.length > t.vagas && !confirm('Isso passa do limite de '+t.vagas+' vagas ('+(S.turma.mats.length + ids.length)+' alunos). Matricular mesmo assim?')) return;
  const solta = travar(btn, 'Matriculando...');
  try { await q(sb.from('solicitacoes').update({ turma_id: turmaId, status: 'matriculada' }).in('id', ids)); toast(ids.length+' aluno(s) matriculado(s).'); recarregar(); } finally { solta(); }
}
async function tirarDaTurma(id){
  if(!confirm('Tirar este aluno da turma? Ele volta para a fila de espera e a vaga fica livre para o próximo da fila.')) return;
  await q(sb.from('solicitacoes').update({ turma_id: null, status: 'aprovada', frequencia: null, nota: null, resultado: null }).eq('id', id));
  recarregar();
}
async function concluirTurma(id, btn){
  const { t, mats } = S.turma;
  const ativos = mats.filter(m => m.status === 'matriculada'), sem = ativos.filter(m => !m.resultado).length;
  if(!t.fim) return toast('Informe a data de término da turma (Editar) antes de concluir.', 'erro');
  if(t.fim > hojeISO()) return toast('A turma termina em ' + fmt(t.fim) + '. Só é possível concluir a partir dessa data.', 'erro');
  if(!ativos.length) return toast('Não há alunos matriculados nesta turma.', 'erro');
  if(sem) return toast('Defina o resultado de todos os alunos. Faltam '+sem+'.', 'erro');
  const ap = ativos.filter(m => m.resultado === 'aprovado').length;
  if(!confirm('Concluir a turma '+t.codigo+'?\n\n'+ap+' aprovado(s) receberão o curso concluído em '+fmt(t.fim)+' (com cálculo de validade).\n'+(ativos.length - ap)+' reprovado(s).\n\nEssa ação não pode ser desfeita.')) return;
  const solta = travar(btn, 'Concluindo...');
  try {
    let r = await sb.rpc('concluir_turma', { p_turma: id, p_forcar: false });
    if(r.error && /PENDENCIAS:/.test(r.error.message)){
      if(!confirm('Atenção — pendências no cronograma:\n\n' + r.error.message.replace(/^.*PENDENCIAS:\s*/, '') + '\n\nConcluir a turma mesmo assim?')) return;
      r = await sb.rpc('concluir_turma', { p_turma: id, p_forcar: true });
    }
    if(r.error) return toast(traduzErro(r.error), 'erro');
    toast('Turma concluída: '+r.data.aprovados+' aprovado(s), '+r.data.reprovados+' reprovado(s).'); recarregar();
  } finally { solta(); }
}
function baixarArquivo(nome, conteudo, tipo){ const b = new Blob([conteudo], { type: tipo }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportarTurma(){
  const { t, mats } = S.turma; if(!mats.length) return toast('Turma sem alunos.', 'erro');
  const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const linhas = [['Nº','Nome','CPF','RG','Data de nascimento','Sexo','Escolaridade','Telefone','E-mail','Endereço','Empresa','Frequência %','Nota','Resultado']].concat(mats.map((m, i) => { const p = m.pessoas || {}; return [i + 1, p.nome, fmtDoc(p.cpf), p.rg, p.nascimento ? fmt(p.nascimento) : '', p.sexo, p.escolaridade, p.telefone, p.email, p.endereco, p.empresa_id && S.empresas[p.empresa_id] ? S.empresas[p.empresa_id].nome : '', m.frequencia, m.nota, m.resultado ? (m.resultado === 'aprovado' ? 'Aprovado' : 'Reprovado') : '']; }));
  baixarArquivo('turma_' + t.codigo.replace(/[^\w-]+/g, '_') + '.csv', '﻿' + linhas.map(l => l.map(c).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
function imprimir(html){
  let f = document.getElementById('pframe');
  if(!f){ f = document.createElement('iframe'); f.id = 'pframe'; f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0'; document.body.appendChild(f); }
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); }, 400);
}
function listaPresenca(aulaId){
  const { t, mats } = S.turma; if(!mats.length) return toast('Turma sem alunos.', 'erro');
  const a = aulaId && S.turma.aulas ? S.turma.aulas.find(x => x.id === aulaId) : null;
  imprimir('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lista de presença</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:18px}h2,p{margin:3px 0}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #777;padding:7px 5px;text-align:left}th{background:#eee}</style></head><body>'+
    '<h2>'+esc(S.escola ? S.escola.nome : '')+'</h2><p><b>Lista de presença — '+esc(t.cursos ? t.cursos.sigla + ' — ' + t.cursos.nome : '')+'</b></p>'+
    '<p>Turma: <b>'+esc(t.codigo)+'</b> · Período: '+fmt(t.inicio)+' a '+fmt(t.fim)+(t.turno ? ' · '+esc(t.turno) : '')+(t.local ? ' · '+esc(t.local) : '')+'</p>'+
    (a ? '<p>Data: <b>'+fmt(a.data)+'</b>'+(a.inicio ? ' · Horário: '+a.inicio.slice(0, 5)+(a.fim ? '–'+a.fim.slice(0, 5) : '') : '')+' · Disciplina: <b>'+esc(a.disciplinas ? a.disciplinas.nome : (a.conteudo || '________________'))+'</b> · Instrutor: '+esc(a.instrutor || '________________')+'</p>'
       : '<p>Data: ____/____/________ · Disciplina: ______________________________ · Instrutor: ______________________________</p>')+
    '<table><tr><th style="width:30px">Nº</th><th>Nome</th><th style="width:120px">CPF</th><th style="width:240px">Assinatura</th></tr>'+mats.map((m, i) => '<tr><td>'+(i + 1)+'</td><td>'+esc(m.pessoas ? m.pessoas.nome : '')+'</td><td>'+fmtDoc(m.pessoas ? m.pessoas.cpf : '')+'</td><td></td></tr>').join('')+'</table></body></html>');
}

const FUNCAO = { admin: 'Administrador', staff: 'Equipe da escola', instrutor: 'Instrutor', aluno: 'Aluno', empresa: 'Empresa' };
async function vEquipe(){
  if(S.perfil.tipo !== 'admin') return '<div class="card">Somente o administrador acessa esta tela.</div>';
  const lista = await q(sb.from('perfis').select('id,nome,email,tipo').eq('escola_id', S.perfil.escola_id).in('tipo', ['staff','admin','instrutor']).order('nome'));
  return '<h2>Equipe da escola</h2><div class="card"><div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Função</th><th></th></tr>'+lista.map(u => '<tr><td><b>'+esc(u.nome || '—')+'</b>'+(u.id === S.perfil.id ? ' <span class="bdg nv">você</span>' : '')+'</td><td>'+esc(u.email)+'</td><td>'+esc(FUNCAO[u.tipo])+'</td><td class="acoes">'+(u.id === S.perfil.id ? '' :
    ['staff','admin','instrutor'].filter(t => t !== u.tipo).map(t => '<button class="btn sec sm" onclick="definirFuncao(\''+u.id+'\',\''+t+'\')">Tornar '+FUNCAO[t].toLowerCase()+'</button> ').join('')+
    '<button class="btn dg sm" onclick="definirFuncao(\''+u.id+'\',\'aluno\')">Remover acesso</button>')+'</td></tr>').join('')+'</table></div>'+
    '<p class="small muted"><b>Administrador</b> faz tudo, inclusive gerenciar a equipe. <b>Equipe da escola</b> analisa documentos, pré-matrículas, cursos e vencimentos. <b>Instrutor</b> só vê as aulas: faz a chamada e marca as horas dadas e a conclusão da disciplina.</p></div>'+
    '<div class="card"><h3>Adicionar pessoa à equipe</h3><p class="small muted" style="margin-top:0">1. Peça para a pessoa criar uma conta pelo link do portal (Painel → Link do portal).<br>2. Busque pelo e-mail que ela usou e defina a função.</p>'+
    '<div class="bar"><input id="eqEmail" type="email" placeholder="e-mail da pessoa" style="flex:1" onkeydown="if(event.key===\'Enter\')buscarEquipe()"><button class="btn nv" onclick="buscarEquipe()">Buscar</button></div><div id="eqRes"></div></div>';
}
async function buscarEquipe(){
  const e = $('#eqEmail').value.trim().toLowerCase().replace(/[,()%]/g, '');
  if(!e) return;
  const r = await q(sb.from('perfis').select('id,nome,email,tipo').eq('escola_id', S.perfil.escola_id).ilike('email', e).limit(5));
  $('#eqRes').innerHTML = r.length ? r.map(u => '<div class="aviso" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>'+esc(u.nome || '—')+'</b> · '+esc(u.email)+' · hoje: '+esc(FUNCAO[u.tipo])+'</div>'+(u.id === S.perfil.id ? '' :
    (u.tipo !== 'instrutor' ? '<button class="btn sec sm" onclick="definirFuncao(\''+u.id+'\',\'instrutor\')">Tornar instrutor</button>' : '')+(u.tipo !== 'staff' ? '<button class="btn sm" onclick="definirFuncao(\''+u.id+'\',\'staff\')">Tornar equipe</button>' : '')+(u.tipo !== 'admin' ? '<button class="btn nv sm" onclick="definirFuncao(\''+u.id+'\',\'admin\')">Tornar administrador</button>' : ''))+'</div>').join('')
    : '<div class="aviso bad">Nenhuma conta com esse e-mail nesta escola. Confira o e-mail ou peça para a pessoa criar a conta pelo link do portal.</div>';
}
async function definirFuncao(id, tipo){
  if(id === S.perfil.id) return toast('Você não pode alterar a sua própria função.', 'erro');
  const msg = { admin: 'Dar acesso de ADMINISTRADOR a esta pessoa?', staff: 'Dar acesso de EQUIPE DA ESCOLA a esta pessoa?', instrutor: 'Dar acesso de INSTRUTOR a esta pessoa? Ela verá as aulas e poderá fazer a chamada.', aluno: 'Remover o acesso desta pessoa ao painel da escola? A conta continua existindo como aluno.' }[tipo];
  if(!confirm(msg)) return;
  await q(sb.from('perfis').update({ tipo }).eq('id', id));
  await carregarInstrutores();
  toast('Função atualizada. A pessoa precisa sair e entrar de novo no sistema.'); recarregar();
}

const VIEWS = { notas: vNotas, historico: vHistorico, aulas: vAulas, chamada: vChamada, fiel: vFiel, turmas: vTurmas, turma: vTurma, equipe: vEquipe, pessoa: vPessoa, vigilantes: vVigilantes, vencimentos: vVencimentos, painel: vPainel, analise: vAnalise, pessoas: vPessoas, empresas: vEmpresas, cursos: vCursos, escola: vEscola, conta: vConta };

/* recarrega a tela ao fechar o aviso pós-análise */
const _fechar = fecharModal;
fecharModal = function(){ _fechar(); if(S._recarregarAoFechar){ S._recarregarAoFechar = false; recarregar(); } };

iniciar();
</script>
